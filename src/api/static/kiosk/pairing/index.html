<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="kiosk-pairing">
    <div class="kiosk-header">
      <div class="header-left">
        <div class="logo-row">
          <div class="logo-row2">
            <div class="logo-badge">
              <div class="div">모두의 약</div>
            </div>
            <div class="div2">모약</div>
          </div>
        </div>
        <div class="step-row">
          <div class="div3">기기 고유 연동</div>
          <div class="div4">
            | 이 자판기와 본인의 스마트폰 앱을 직접 연결합니다
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="lang-button">
          <div class="div5">한국어</div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
    </div>
    <div class="pairing-content">
      <div class="pair-title-block">
        <div class="qr">앱에서 기기 QR을 스캔해주세요</div>
        <div class="qr2">
          스마트폰 앱 내의 &#039;기기 연동&#039; 메뉴를 눌러 아래 QR을 스캔하세요.
        </div>
      </div>
      <div class="qr-pair-plate">
        <canvas class="qr-code" id="qrCanvas" width="320" height="320"></canvas>
        <div class="device-id-badge">
          <div class="md-2409-rome">자판기 고유인증 키: <span id="machineIdText">-</span></div>
        </div>
      </div>
      <div class="status-indicator">
        <div class="spinner" id="spinner"></div>
        <div class="div6" id="statusText">스마트폰 연동 대기 중...</div>
      </div>
      <div class="div7">
        스마트폰 연동 시, 구매 이력과 처방전 연동 등이 완벽히 동기화되어
        <br />
        안전한 약품 복용 지도가 가능해집니다.
      </div>
    </div>
    <div class="kiosk-footer">
      <div class="footer-left">
        <div class="btn-back">
          <img class="arrow-left" src="arrow-left0.svg" />
          <div class="div8">이전으로</div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/lib/browser.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  document.getElementById("machineIdText").textContent = machineId;

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  let currentToken = null;
  let rotateTimer = null;
  let pollTimer = null;

  async function rotateQr() {
    try {
      const data = await api("POST", `/vending/machines/${encodeURIComponent(machineId)}/rotate-qr`);
      currentToken = data.qr_token;
      const payload = JSON.stringify({ machine_id: data.machine_id, qr_token: data.qr_token });
      QRCode.toCanvas(document.getElementById("qrCanvas"), payload, { width: 320, margin: 1 });
    } catch (e) {
      document.getElementById("statusText").textContent = "QR 발급 실패, 잠시 후 재시도합니다...";
    }
  }

  async function pollSession() {
    try {
      const data = await api("GET", `/vending/machines/${encodeURIComponent(machineId)}/session`);
      if (data.paired && data.purchase) {
        clearInterval(rotateTimer);
        clearInterval(pollTimer);
        document.getElementById("spinner").style.display = "none";
        document.getElementById("statusText").textContent = "✅ 연동 완료! 확인 화면으로 이동합니다...";
        setTimeout(() => {
          location.href = `/kiosk/welcome/?machine=${encodeURIComponent(machineId)}&purchase=${encodeURIComponent(data.purchase.id)}`;
        }, 1200);
      }
    } catch (e) {
      // 네트워크 순단은 다음 폴링에서 다시 시도
    }
  }

  rotateQr();
  rotateTimer = setInterval(rotateQr, 55000); // 토큰 유효시간(60초)보다 여유있게 재발급
  pollTimer = setInterval(pollSession, 2000);

  document.querySelector(".btn-back").addEventListener("click", () => {
    location.href = "/kiosk/qr-download/";
  });
</script>
</body>
</html>
