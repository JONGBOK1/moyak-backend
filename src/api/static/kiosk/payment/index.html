<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>결제 진행</title>
</head>
<body>
  <div class="kiosk-payment">
    <div class="kiosk-header">
      <div class="header-left">
        <div class="step-row">
          <div class="div">결제 진행</div>
          <div class="div2">| 주문 정보를 확인하신 후 결제를 완료해주세요</div>
        </div>
        <div class="logo-row">
          <div class="logo-badge">
            <div class="div3">모두의 약</div>
          </div>
          <div class="div4">모약</div>
        </div>
      </div>
      <div class="header-right">
        <div class="lang-button">
          <div class="div5">한국어</div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
    </div>
    <div class="user-pill">
      <img class="user-check" src="user-check0.svg" />
      <div class="div6">지*민 님</div>
    </div>
    <div class="payment-body">
      <div class="panel-grid">
        <div class="right-pay-panel">
          <div class="_2">2. 결제 수단 선택</div>
          <div class="pay-options">
            <div class="pay-card-selected">
              <div class="card-logo">
                <img class="credit-card" src="credit-card0.svg" />
              </div>
              <div class="frame">
                <div class="div7">신용/체크카드 결제</div>
                <div class="div8">투입구에 카드를 끝까지 넣어주세요</div>
              </div>
              <img class="check-circle" src="check-circle0.svg" />
            </div>
            <div class="pay-samsung">
              <img class="smartphone" src="smartphone0.svg" />
              <div class="div9">삼성페이 / 모바일 페이</div>
            </div>
          </div>
          <div class="btn-cancel">
            <div class="div10">결제 취소</div>
          </div>
          <div class="btn-execute-pay">
            <div class="div11">기기에서 결제 완료하기</div>
          </div>
        </div>
      </div>
    </div>
    <div class="left-summary-panel">
      <div class="_1">1. 구매 약품 상세 내역</div>
      <div class="order-rows" id="orderRows"></div>
      <div class="table-header">
        <div class="div13">수량</div>
      </div>
      <div class="div14">약품명</div>
      <div class="div15">금액</div>
      <div class="billing-block">
        <div class="total-line">
          <div class="div16">최종 결제 금액</div>
        </div>
        <div class="_4-500">4,500원</div>
      </div>
    </div>
    <div class="kiosk-footer">
      <div class="footer-left">
        <div class="btn-back">
          <img class="arrow-left" src="arrow-left0.svg" />
          <div class="div17">이전으로</div>
        </div>
      </div>
    </div>
    <div class="div18" id="logoutBtn">회원 로그아웃</div>
  </div>

<style>
  /* 디자인의 고정 샘플 2행 대신 실제 주문 행을 그리기 위한 보조 스타일 */
  .order-rows { position: absolute; left: 48px; top: 156px; width: 899px; height: 264px; overflow-y: auto; }
  .order-row { position: relative; height: 58px; border-bottom: 1px solid #e2e8f0; font-size: 24px; }
  .order-row > div { position: absolute; top: 14px; }
  .order-row .name { left: 0; width: 600px; color: #0f172a; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-row .qty { left: 664px; width: 120px; text-align: center; color: #475569; font-weight: 600; }
  .order-row .amount { right: 14px; color: #0f172a; font-weight: 800; }
  .pay-card-selected .frame { width: auto; }
  .pay-card-selected .div7, .pay-card-selected .div8 { white-space: nowrap; }
  .pay-card-selected .check-circle { left: auto; right: 32px; }
  ._4-500 { left: auto; right: 32px; }
  .pay-card-selected, .pay-samsung, .btn-cancel, .btn-execute-pay, .btn-back, .div18 { cursor: pointer; }
  .pay-option-active { opacity: 1 !important; border: 2px solid #ffd54f !important; background: #fff8e1 !important; }
  .pay-option-inactive { opacity: 0.6; border: 1px solid rgba(120, 120, 128, 0.16) !important; background: transparent !important; }
  .btn-execute-pay.busy { opacity: 0.5; pointer-events: none; }
</style>
<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  const orderId = params.get("order"); // 의약외품 장바구니 주문
  // 약사 승인 약(cart2) 결제 — 쉼표로 구분된 승인 건 id 목록
  const purchaseIds = (params.get("purchases") || "").split(",").filter(Boolean);
  const m = encodeURIComponent(machineId);
  const q = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function renderRows(rows, total) {
    q("#orderRows").innerHTML = rows
      .map((r) => `<div class="order-row"><div class="name">${esc(r.name)}</div><div class="qty">${r.qty}개</div><div class="amount">${r.amount.toLocaleString()}원</div></div>`)
      .join("");
    q("._4-500").textContent = total.toLocaleString() + "원";
  }

  async function loadSession() {
    const session = await api("GET", `/vending/machines/${m}/session`);
    // 의약외품은 비회원도 살 수 있어서, 로그인한 경우에만 회원 표시/로그아웃을 보여준다.
    q(".user-pill").hidden = !session.paired;
    q("#logoutBtn").hidden = !session.paired;
    q(".div6").textContent = "회원 님"; // 실명 데이터가 없어 "지*민 님" 대신 일반 호칭
    return session;
  }

  async function load() {
    q("._4-500").textContent = "";
    try {
      const session = await loadSession();
      if (purchaseIds.length) {
        if (!session.paired) throw new Error("자판기 로그인이 해제되었습니다. QR로 다시 로그인해주세요.");
        const all = await api("GET", `/vending/purchases?user_id=${encodeURIComponent(session.user_id)}`);
        const items = all.filter((p) => purchaseIds.includes(p.id));
        renderRows(
          items.map((p) => ({ name: p.drug_item_name, qty: 1, amount: p.price || 0 })),
          items.reduce((sum, p) => sum + (p.price || 0), 0)
        );
        return;
      }
      if (!orderId) {
        alert("잘못된 접근입니다. 장바구니부터 다시 진행해주세요.");
        location.href = `/kiosk/otc-list/?machine=${m}`;
        return;
      }
      const order = await api("GET", `/vending/orders/${encodeURIComponent(orderId)}`);
      renderRows(
        order.items.map((it) => ({ name: it.item_name, qty: it.quantity, amount: it.unit_price * it.quantity })),
        order.total_amount
      );
    } catch (e) {
      alert("주문 정보를 불러오지 못했습니다: " + e.message);
    }
  }

  // 결제 수단 선택 (모의 — 실제 카드/모바일 결제 연동은 아직 없음)
  const options = [q(".pay-card-selected"), q(".pay-samsung")];
  function selectOption(i) {
    options.forEach((el, j) => {
      el.classList.toggle("pay-option-active", i === j);
      el.classList.toggle("pay-option-inactive", i !== j);
    });
    q(".check-circle").style.visibility = i === 0 ? "visible" : "hidden";
  }
  options.forEach((el, i) => el.addEventListener("click", () => selectOption(i)));
  selectOption(0);

  const cancel = () => (location.href = `/kiosk/${purchaseIds.length ? "cart2" : "cart"}/?machine=${m}`);
  q(".btn-cancel").addEventListener("click", cancel);
  q(".btn-back").addEventListener("click", cancel);

  q("#logoutBtn").addEventListener("click", async () => {
    // QR을 새로 발급하면 서버에서 이 자판기의 로그인(페어링)이 해제된다.
    try {
      await fetch(`/vending/machines/${m}/rotate-qr`, { method: "POST" });
    } finally {
      location.href = "/kiosk/start/";
    }
  });

  q(".btn-execute-pay").addEventListener("click", async () => {
    const btn = q(".btn-execute-pay");
    btn.classList.add("busy");
    q(".div11").textContent = "결제 처리 중...";
    try {
      if (purchaseIds.length) {
        // 결제가 끝나면 서버가 자판기 로그인을 해제한다 (결제 완료 시 자동 로그아웃)
        await api("POST", "/vending/purchases/pay", { machine_id: machineId, purchase_ids: purchaseIds });
        location.href = `/kiosk/dispensing/?machine=${m}&purchases=${encodeURIComponent(purchaseIds.join(","))}`;
        return;
      }
      await api("POST", `/vending/orders/${encodeURIComponent(orderId)}/pay`);
      location.href = `/kiosk/dispensing/?machine=${m}&order=${encodeURIComponent(orderId)}`;
    } catch (e) {
      alert("결제에 실패했습니다: " + e.message);
      btn.classList.remove("busy");
      q(".div11").textContent = "기기에서 결제 완료하기";
    }
  });

  load();
</script>
</body>
</html>
