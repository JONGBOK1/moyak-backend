<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>결제</title>
</head>
<body>
  <div class="kiosk-payment">
    <div class="header">
      <div class="title">결제 진행</div>
      <div class="subtitle">주문 정보를 확인한 후 결제를 완료해주세요</div>
    </div>

    <div class="content">
      <div class="order-block">
        <div class="block-title">1. 구매 약품 상세 내역</div>
        <div class="order-items" id="orderItems"></div>
        <div class="total-row">
          <span>최종 결제 금액</span>
          <span id="totalAmount">0원</span>
        </div>
      </div>

      <div class="pay-block">
        <div class="block-title">2. 결제 수단 선택</div>
        <div class="pay-methods">
          <button class="pay-method-btn active" data-method="card">신용/체크카드</button>
          <button class="pay-method-btn" data-method="qr">간편결제 (QR)</button>
        </div>
        <div class="pay-hint">기기 하단의 카드 리더기에 카드를 삽입해주세요.</div>
      </div>
    </div>

    <div class="footer">
      <button class="btn-cancel" id="cancelBtn">결제 취소</button>
      <button class="btn-pay" id="payBtn">기기에서 결제 완료하기</button>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  const orderId = params.get("order"); // 의약외품 장바구니 주문
  // 약사 승인 약(cart2) 결제 — 쉼표로 구분된 승인 건 id 목록
  const purchaseIds = (params.get("purchases") || "").split(",").filter(Boolean);

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function loadPurchases() {
    try {
      const session = await api("GET", `/vending/machines/${encodeURIComponent(machineId)}/session`);
      if (!session.paired) throw new Error("자판기 로그인이 해제되었습니다. QR로 다시 로그인해주세요.");
      const all = await api("GET", `/vending/purchases?user_id=${encodeURIComponent(session.user_id)}`);
      const items = all.filter((p) => purchaseIds.includes(p.id));
      document.getElementById("orderItems").innerHTML = items
        .map((p) => `<div class="order-item"><span>${esc(p.drug_item_name)} x1</span><span>${(p.price || 0).toLocaleString()}원</span></div>`)
        .join("");
      const total = items.reduce((sum, p) => sum + (p.price || 0), 0);
      document.getElementById("totalAmount").textContent = total.toLocaleString() + "원";
    } catch (e) {
      alert("승인 약 정보를 불러오지 못했습니다: " + e.message);
    }
  }

  async function loadOrder() {
    if (purchaseIds.length) return loadPurchases();
    if (!orderId) {
      alert("잘못된 접근입니다. 장바구니부터 다시 진행해주세요.");
      location.href = `/kiosk/otc-list/?machine=${encodeURIComponent(machineId)}`;
      return;
    }
    try {
      const order = await api("GET", `/vending/orders/${encodeURIComponent(orderId)}`);
      document.getElementById("orderItems").innerHTML = order.items
        .map(
          (it) =>
            `<div class="order-item"><span>${it.item_name} x${it.quantity}</span><span>${(it.unit_price * it.quantity).toLocaleString()}원</span></div>`
        )
        .join("");
      document.getElementById("totalAmount").textContent = order.total_amount.toLocaleString() + "원";
    } catch (e) {
      alert("주문 정보를 불러오지 못했습니다: " + e.message);
    }
  }

  document.querySelectorAll(".pay-method-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".pay-method-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });

  document.getElementById("cancelBtn").addEventListener("click", () => {
    location.href = `/kiosk/${purchaseIds.length ? "cart2" : "cart"}/?machine=${encodeURIComponent(machineId)}`;
  });

  document.getElementById("payBtn").addEventListener("click", async () => {
    const payBtn = document.getElementById("payBtn");
    payBtn.disabled = true;
    payBtn.textContent = "결제 처리 중...";
    try {
      if (purchaseIds.length) {
        // 결제가 끝나면 서버가 자판기 로그인을 해제한다 (결제 완료 시 자동 로그아웃)
        await api("POST", "/vending/purchases/pay", { machine_id: machineId, purchase_ids: purchaseIds });
        location.href = `/kiosk/dispensing/?machine=${encodeURIComponent(machineId)}&purchases=${encodeURIComponent(purchaseIds.join(","))}`;
        return;
      }
      await api("POST", `/vending/orders/${encodeURIComponent(orderId)}/pay`);
      location.href = `/kiosk/dispensing/?machine=${encodeURIComponent(machineId)}&order=${encodeURIComponent(orderId)}`;
    } catch (e) {
      alert("결제에 실패했습니다: " + e.message);
      payBtn.disabled = false;
      payBtn.textContent = "기기에서 결제 완료하기";
    }
  });

  loadOrder();
</script>
</body>
</html>
