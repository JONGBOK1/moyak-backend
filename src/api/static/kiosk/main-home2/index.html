<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/static/vendor/app-scale.js" data-width="1080" data-height="1920" data-match-bg></script>
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="kiosk-main-home-2">
    <div class="content-wrapper">
      <div class="rectangle-2"></div>
      <div class="kiosk-header">
        <div class="header-left">
          <div class="logo-row">
            <div class="logo-badge">
              <div class="div">모두의 약</div>
            </div>
            <div class="div2">모약</div>
          </div>
          <div class="step-row">
            <div class="div3">시작하기</div>
            <div class="div4">| 원하시는 구매 방법을 선택해 주세요</div>
          </div>
        </div>
        <div class="lang-button">
          <div class="div5">한국어</div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
      <div class="arrow-wrap">
        <div class="_2">2</div>
      </div>
      <div class="user-pill">
        <img class="user-check" src="user-check0.svg" />
        <div class="div6">지*민 님</div>
      </div>
      <div class="routes-stack">
        <div class="frame-1">
          <div class="route-card-0">
            <div class="card-left">
              <div class="icon-wrap">
                <img class="pill-bottle" src="pill-bottle0.svg" />
              </div>
              <div class="text-wrap">
                <div class="title-badge">
                  <div class="div7">의약외품 즉시 구매</div>
                  <div class="badge">
                    <div class="div8">인증 불필요</div>
                  </div>
                </div>
                <div class="div9">
                  밴드, 거즈, 마스크 등 의약외품을 본인인증 없이 간편하게 구매할
                  수 있습니다.
                </div>
              </div>
            </div>
            <div class="arrow-wrap2">
              <img class="arrow-right" src="arrow-right0.svg" />
            </div>
          </div>
          <div class="route-card-1">
            <div class="card-left">
              <div class="icon-wrap">
                <img class="shield-user" src="shield-user0.svg" />
              </div>
              <div class="text-wrap">
                <div class="title-badge2">
                  <div class="div7">본인인증 필요 약품 구매</div>
                  <div class="badge2">
                    <div class="div10">본인인증</div>
                  </div>
                </div>
                <div class="div9">
                  모바일 앱 연동 및 간편 본인인증이 필요한 성인 의약품 및 제한
                  약품 구매
                </div>
              </div>
            </div>
            <div class="arrow-wrap2">
              <img class="arrow-right2" src="arrow-right1.svg" />
            </div>
          </div>
          <div class="route-card-1">
            <div class="card-left">
              <img class="icon-wrap2" src="icon-wrap2.svg" />
              <div class="text-wrap">
                <div class="title-badge3">
                  <div class="div7">앱 다운로드 및 사용 방법</div>
                </div>
                <div class="div9">
                  모약 앱을 다운로드하고 다양한 서비스를 이용해 보세요.
                </div>
              </div>
            </div>
            <div class="arrow-wrap2">
              <img class="arrow-right3" src="arrow-right2.svg" />
            </div>
          </div>
        </div>
        <div class="hero-banner">
          <div class="_365-24">
            365일 24시간 스마트 비상 의약품 자판기 서비스 모두의 약입니다.
          </div>
          <div class="div11">승인받은 약이 있습니다!</div>
          <div class="_1">타이레놀 외 1건 터치해서 바로 받기</div>
          <img class="ellipse-1" src="ellipse-10.svg" />
          <img class="arrow-right4" src="arrow-right3.svg" />
          <img class="moyak-chick-full-1" src="moyak-chick-full-10.png" />
        </div>
      </div>
    </div>
    <div class="kiosk-footer"></div>
    <div class="div12" id="logoutBtn">회원 로그아웃</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  const q = (s) => document.querySelector(s);

  async function api(method, path) {
    const res = await fetch(path, { method });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  async function load() {
    try {
      const session = await api("GET", `/vending/machines/${encodeURIComponent(machineId)}/session`);
      if (!session.paired) {
        location.href = "/kiosk/start/"; // 로그인이 풀렸으면(QR 재발급 등) 처음으로
        return;
      }
      // 실명 데이터가 없어서 디자인의 "지*민 님" 대신 일반 호칭을 쓴다.
      q(".div6").textContent = "연동 회원 님";

      const purchases = await api("GET", `/vending/purchases?user_id=${encodeURIComponent(session.user_id)}`);
      let usable = purchases.filter((p) => p.status === "pending");
      // main-home3과 같은 기준(session.purchase)으로만 분기해야 두 화면이 서로 왔다갔다 하지 않는다.
      if (!session.purchase) {
        // 승인 건이 없으면 "승인받은 약이 없어요" 홈으로
        location.href = `/kiosk/main-home3/?machine=${encodeURIComponent(machineId)}`;
        return;
      }
      if (usable.length === 0) usable = [session.purchase];
      // 승인 약 확인(cart2) → 결제 → 수령
      receiveUrl = `/kiosk/cart2/?machine=${encodeURIComponent(machineId)}`;
      q("._2").textContent = usable.length;
      q("._1").textContent =
        (usable.length > 1 ? `${usable[0].drug_item_name} 외 ${usable.length - 1}건` : usable[0].drug_item_name) +
        " 터치해서 바로 받기";
    } catch (e) {
      q("._1").textContent = "정보를 불러오지 못했습니다: " + e.message;
    }
  }

  let receiveUrl = null;
  const go = (path) => () => (location.href = `${path}?machine=${encodeURIComponent(machineId)}`);
  const receive = () => { if (receiveUrl) location.href = receiveUrl; };

  q(".hero-banner").style.cursor = "pointer";
  q(".hero-banner").addEventListener("click", receive);
  const cards = document.querySelectorAll(".frame-1 > div");
  cards.forEach((c) => (c.style.cursor = "pointer"));
  cards[0].addEventListener("click", go("/kiosk/otc-list/"));
  cards[1].addEventListener("click", receive);
  cards[2].addEventListener("click", go("/kiosk/main-home-guide/"));

  q("#logoutBtn").style.cursor = "pointer";
  q("#logoutBtn").addEventListener("click", async () => {
    // QR을 새로 발급하면 서버에서 이 자판기의 로그인(페어링)이 해제된다.
    try {
      await fetch(`/vending/machines/${encodeURIComponent(machineId)}/rotate-qr`, { method: "POST" });
    } finally {
      location.href = "/kiosk/start/";
    }
  });

  load();
</script>
</body>
</html>
