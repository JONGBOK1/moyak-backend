<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/static/vendor/app-scale.js" data-width="1080" data-height="1920" data-match-bg></script>
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>승인된 약 확인</title>
</head>
<body>
  <div class="kiosk-cart-2">
    <div class="screen-content">
      <div class="kiosk-header">
        <div class="header-left">
          <div class="step-row">
            <div class="div">장바구니</div>
            <div class="div2">| 담으신 약품 내역을 확인해 주세요</div>
          </div>
        </div>
        <div class="logo-row">
          <div class="logo-badge">
            <div class="div3">모두의 약</div>
          </div>
          <div class="div4">모약</div>
        </div>
        <div class="lang-button">
          <div class="div5">한국어</div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
      <div class="cart-body">
        <div class="cart-header-badge">
          <div class="div6">승인된 약 확인</div>
          <div class="div7">앱에서 승인받은 약이에요</div>
        </div>
        <div class="cart-items-ledger"><!-- JS가 실제 승인 약으로 채움 -->
        </div>
        <div class="user-pill">
          <img class="user-check" src="user-check0.svg" />
          <div class="div13">지*민 님</div>
        </div>
        <div class="count-badge">
          <div class="_2-3">2종류 (총 3개)</div>
        </div>
      </div>
    </div>
    <div class="billing-calculation">
      <div class="calc-line"></div>
      <div class="calc-line-promo"></div>
      <div class="line"></div>
      <div class="calc-line-final">
        <div class="div14">최종 결제 금액</div>
        <div class="_9-500">9,500원</div>
      </div>
    </div>
    <div class="footer-and-confirm">
      <div class="action-button-row">
        <div class="btn-checkout">
          <div class="div15">선택완료 및 결제하기</div>
        </div>
        <div class="div16">회원 로그아웃</div>
      </div>
      <div class="kiosk-footer">
        <div class="footer-left">
          <div class="btn-back">
            <img class="arrow-left" src="arrow-left0.svg" />
            <div class="div17">첫 화면으로</div>
          </div>
          <div class="_10">
            * 장바구니에 담긴 약품은 미선택 및 미결제 시 10분 후 자동 삭제되어
            안전 정렬됩니다.
          </div>
        </div>
        <div class="footer-right"></div>
      </div>
    </div>
  </div>

<style>
  /* 디자인의 고정 샘플 2행 대신 실제 승인 약 행을 그리기 위한 보조 스타일 */
  .cart-items-ledger { height: 1130px; overflow-y: auto; }
  .cart-items-ledger .badge { left: 0; width: auto; height: auto; white-space: nowrap; }
  .cart-items-ledger .badge .div9 { position: static; }
  .thumb-img.placeholder { background: #fff8e1; object-fit: none; }
  .cart-header-badge .div7 { white-space: nowrap; }
  .count-badge { width: auto; white-space: nowrap; left: 520px; }
  ._2-3 { position: static; }
  ._9-500 { left: auto; right: 0; }
  .stepper ._1 { left: 0; right: 0; text-align: center; }
  .cart-items-ledger .div12 { left: 0; right: 0; text-align: center; font-size: 26px; }
  .remove-btn, .btn-checkout, .btn-back, .div16 { cursor: pointer; }
  .btn-checkout.disabled { opacity: 0.4; cursor: default; }
  .cart-empty { padding-top: 120px; text-align: center; color: #475569; font-size: 28px; font-weight: 700; }
</style>
<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  const q = (s) => document.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const priceText = (p) => (p.price == null ? "결제 불필요" : `${p.price.toLocaleString()}원`);

  let items = []; // 이번에 받을 승인 약 (ⓧ로 뺀 건 제외 — 승인 자체가 취소되지는 않는다)

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function render() {
    const ledger = q(".cart-items-ledger");
    ledger.innerHTML = "";
    if (items.length === 0) {
      ledger.innerHTML = '<div class="cart-empty">이번에 받을 승인 약이 없습니다.</div>';
    }
    items.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "cart-row-0";
      row.style.top = `${i * 164}px`;
      row.innerHTML = `
        <div class="item-info">
          <img class="thumb-img placeholder" src="pill-bottle0.svg" />
          <div class="item-text">
            <div class="tag-row"><div class="badge"><div class="div9">승인 완료</div></div></div>
            <div class="_500-mg-8">${esc(p.drug_item_name)}</div>
          </div>
        </div>
        <div class="item-actions">
          <div class="stepper"><div class="_1">1</div></div>
          <div class="_3-500">${priceText(p)}</div>
          <div class="remove-btn"><img class="x-circle" src="x-circle0.svg" /></div>
        </div>`;
      row.querySelector(".remove-btn").addEventListener("click", () => {
        items.splice(i, 1);
        render();
      });
      ledger.appendChild(row);
    });
    if (items.length) {
      const note = document.createElement("div");
      note.className = "div12";
      note.style.top = `${items.length * 164 + 16}px`;
      note.textContent = "승인받은 수량만 구매할 수 있어요";
      ledger.appendChild(note);
    }

    const total = items.reduce((sum, p) => sum + (p.price || 0), 0);
    q("._2-3").textContent = `${items.length}종류 (총 ${items.length}개)`;
    q("._9-500").textContent = total.toLocaleString() + "원";
    q(".btn-checkout").classList.toggle("disabled", items.length === 0);
  }

  async function load() {
    try {
      const session = await api("GET", `/vending/machines/${encodeURIComponent(machineId)}/session`);
      if (!session.paired) {
        location.href = "/kiosk/start/"; // 로그인이 풀렸으면(QR 재발급 등) 처음으로
        return;
      }
      // 실명 데이터가 없어서 디자인의 "지*민 님" 대신 일반 호칭을 쓴다.
      q(".div13").textContent = "회원 님";
      const purchases = await api("GET", `/vending/purchases?user_id=${encodeURIComponent(session.user_id)}`);
      items = purchases.filter((p) => p.status === "pending" && !p.paid_at);
      render();
    } catch (e) {
      q(".cart-items-ledger").innerHTML = `<div class="cart-empty">정보를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    }
  }

  async function logout() {
    // QR을 새로 발급하면 서버에서 이 자판기의 로그인(페어링)이 해제된다.
    try {
      await fetch(`/vending/machines/${encodeURIComponent(machineId)}/rotate-qr`, { method: "POST" });
    } finally {
      location.href = "/kiosk/start/";
    }
  }

  q(".btn-checkout").addEventListener("click", () => {
    if (items.length === 0) return;
    const ids = encodeURIComponent(items.map((p) => p.id).join(","));
    const m = encodeURIComponent(machineId);
    // 가격이 하나도 없으면(가격 도입 전 승인 건) 결제 없이 바로 수령
    const needsPayment = items.some((p) => p.price != null);
    location.href = needsPayment ? `/kiosk/payment/?machine=${m}&purchases=${ids}` : `/kiosk/dispensing/?machine=${m}&purchases=${ids}`;
  });
  q(".btn-back").addEventListener("click", () => {
    location.href = `/kiosk/main-home2/?machine=${encodeURIComponent(machineId)}`;
  });
  q(".div16").addEventListener("click", logout);

  // 안내 문구대로 10분간 조작이 없으면 — 공용 기기라 로그아웃까지 해서 다음 사람이 못 쓰게 한다
  let idleTimer;
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(logout, 10 * 60 * 1000);
  }
  ["click", "touchstart"].forEach((ev) => document.addEventListener(ev, resetIdle));
  resetIdle();

  load();
</script>
</body>
</html>
