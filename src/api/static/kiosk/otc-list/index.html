<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/static/vendor/app-scale.js" data-width="1080" data-height="1920" data-match-bg></script>
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
<style>
  /* 상품이 늘어나도 보이도록 — 절대 위치 대신 격자로 흐르게 하고, 넘치면 스크롤한다.
     카드 생김새(배경·모서리·테두리·그림자·크기)는 Figma 값 그대로 쓴다. */
  .product-grid { overflow-y: auto; overflow-x: hidden; }
  .prod-list {
    display: grid;
    grid-template-columns: repeat(3, 301.33px);
    gap: 24px;
  }
  .prod-card {
    background: #fff8e1;
    border-radius: 16px;
    border: 1px solid #fff3c4;
    width: 301.33px;
    height: 406px;
    position: relative;        /* 절대 위치를 쓰지 않는다 — 이게 6개 제한의 원인이었다 */
    box-shadow: 0px 10px 25px 0px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }
  .prod-card .pc-badge {
    position: absolute; left: 24px; top: 24px;
    background: #fde68a; border-radius: 999px;
    padding: 6px 14px; color: #8b6914;
    font-family: "Inter-SemiBold", sans-serif; font-size: 15px; font-weight: 600;
  }
  .prod-card .pc-name {
    position: absolute; left: 24px; top: 71px; width: 253.33px;
    color: #0f172a; font-family: "Inter-ExtraBold", sans-serif;
    font-size: 24px; font-weight: 800; line-height: 1.25;
  }
  .prod-card .pc-company {
    position: absolute; left: 24px; top: 150px; width: 253.33px;
    color: #64748b; font-family: "Inter-Regular", sans-serif; font-size: 16px;
  }
  .prod-card .pc-stock {
    position: absolute; left: 24px; top: 178px;
    color: #64748b; font-family: "Inter-Regular", sans-serif; font-size: 15px;
  }
  .prod-card .pc-bottom {
    position: absolute; left: 24px; right: 24px; bottom: 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .prod-card .pc-price {
    color: #8b6914; font-family: "Inter-Bold", sans-serif;
    font-size: 26px; font-weight: 700;
  }
  .prod-card .pc-btn {
    background: #f59e0b; border-radius: 12px; padding: 12px 22px;
    color: #fff; font-family: "Inter-Bold", sans-serif; font-size: 18px; font-weight: 700;
    cursor: pointer; user-select: none;
  }
  .prod-card.is-picked .pc-btn { opacity: 0.55; }
  .prod-card.is-soldout { opacity: 0.5; }
  .prod-card.is-soldout .pc-btn { background: #94a3b8; cursor: default; }
  .prod-empty {
    display: none; padding: 80px 0; text-align: center;
    color: #94a3b8; font-family: "Inter-SemiBold", sans-serif; font-size: 22px;
  }
  /* 탭을 누르면 눌린 것이 보이게 */
  .tabs-scroll > div { cursor: pointer; }
  .tabs-scroll > div.is-on { outline: 3px solid #f59e0b; border-radius: 999px; }
</style>
</head>
<body>
  <div class="kiosk-otc-list">
    <div class="kiosk-header">
      <div class="header-left">
        <div class="step-row">
          <div class="div">의약외품 목록</div>
          <div class="div2">| 처방전 없이 즉시 구매 가능한 약품</div>
        </div>
        <div class="logo-row">
          <div class="logo-badge">
            <div class="div3">모두의 약</div>
          </div>
          <div class="div4">모약</div>
        </div>
      </div>
      <div class="header-right">
        <div class="lang-button">
          <div class="div5">한국어</div>
          <img class="chevron-down" src="chevron-down0.svg" />
        </div>
      </div>
    </div>
    <div class="list-content">
      <div class="search-row">
        <img class="search" src="search0.svg" />
        <div class="div6">
          필요한 제품을 검색해 보세요 (예: 밴드, 거즈, 마스크)
        </div>
      </div>
      <div class="tabs-scroll">
        <div class="tab-0">
          <div class="div7">전체</div>
        </div>
        <div class="tab-1">
          <div class="div8">진통/해열제</div>
        </div>
        <div class="tab-2">
          <div class="div7">소화/위장약</div>
        </div>
        <div class="tab-3">
          <div class="div7">감기약/기침약</div>
        </div>
        <div class="tab-4">
          <div class="div7">상처/연고</div>
        </div>
        <div class="tab-5">
          <div class="div7">안대/밴드/기타</div>
        </div>
      </div>
      <!-- Figma 가 뽑아 준 카드 6개는 절대 위치로 3x2 에 고정돼 있어서 상품이 6종을
           넘으면 들어갈 자리가 없었다. 상품 수에 맞춰 늘어나는 격자로 바꾸고 카드는
           자바스크립트가 그린다. 생김새(색·모서리·그림자·크기)는 그대로 뒀다. -->
      <div class="product-grid">
        <div class="prod-list" id="prod-list"></div>
        <div class="prod-empty" id="prod-empty">해당하는 상품이 없습니다</div>
      </div>
      <div class="cart-summary">
        <div class="summary-left">
          <div class="cart-icon">
            <img class="shopping-bag" src="shopping-bag0.svg" />
          </div>
          <div class="item-count">
            <div class="div12">선택한 약품</div>
            <div class="_1">알콜스왑외 1건</div>
          </div>
        </div>
        <div class="summary-right">
          <div class="total-block">
            <div class="div13">합계 금액</div>
            <div class="_7-000">7,000원</div>
          </div>
          <div class="btn-next-step">
            <div class="div14">선택 완료 (결제하기)</div>
          </div>
        </div>
      </div>
    </div>
    <div class="kiosk-footer">
      <div class="footer-left">
        <div class="btn-back">
          <img class="arrow-left" src="arrow-left0.svg" />
          <div class="div15">이전으로</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "VM-001";
  const CART_KEY = `moyak_kiosk_cart_${machineId}`;

  // 예전에는 Figma 카드 6개를 상품명으로 찾아 붙였다. 상품이 6종을 넘으면 나머지가
  // 화면에 아예 안 나오고, 이름을 조금만 바꿔도 장바구니에 담기지 않았다.
  // 이제는 API 가 주는 목록으로 카드를 그린다.
  let PRODUCTS = [];          // 자판기에 있는 상품 전부
  let activeCategory = "전체";
  let searchQuery = "";

  const TAB_CATEGORIES = ["전체", "진통/해열제", "소화/위장약", "감기약/기침약", "상처/연고", "안대/밴드/기타"];

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function loadCart() {
    try {
      return JSON.parse(sessionStorage.getItem(CART_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveCart(cart) {
    sessionStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function renderCartSummary() {
    const cart = loadCart();
    const labelEl = document.querySelector(".item-count > div:last-child");
    const totalEl = document.querySelector(".summary-right .total-block > div:last-child");

    if (cart.length === 0) {
      if (labelEl) labelEl.textContent = "담은 약품이 없습니다";
    } else {
      const extra = cart.length - 1;
      if (labelEl) labelEl.textContent = extra > 0 ? `${cart[0].itemName}외 ${extra}건` : cart[0].itemName;
    }
    const total = cart.reduce((sum, c) => sum + c.price * c.quantity, 0);
    if (totalEl) totalEl.textContent = total.toLocaleString() + "원";
  }

  // ---------- 상품 카드 그리기 ----------
  function cardHtml(p) {
    const soldout = p.stock <= 0;
    const picked = loadCart().some((c) => c.productId === p.id);
    const cls = ["prod-card", soldout ? "is-soldout" : "", picked ? "is-picked" : ""].join(" ");
    return `<div class="${cls}" data-id="${esc(p.id)}">
        <div class="pc-badge">${esc(p.badge || p.category || "")}</div>
        <div class="pc-name">${esc(p.item_name)}</div>
        <div class="pc-company">${esc(p.company || "")}</div>
        <div class="pc-stock">${soldout ? "품절" : `남은 수량 ${p.stock}개`}</div>
        <div class="pc-bottom">
          <div class="pc-price">${Number(p.price).toLocaleString()}원</div>
          <div class="pc-btn">${soldout ? "품절" : picked ? "담김 ✓" : "담기"}</div>
        </div>
      </div>`;
  }

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function visibleProducts() {
    return PRODUCTS.filter((p) => {
      const byTab = activeCategory === "전체" || p.category === activeCategory;
      const byText = !searchQuery || p.item_name.includes(searchQuery)
                     || (p.badge || "").includes(searchQuery);
      return byTab && byText;
    });
  }

  function renderProducts() {
    const list = visibleProducts();
    const listEl = document.getElementById("prod-list");
    const emptyEl = document.getElementById("prod-empty");
    listEl.innerHTML = list.map(cardHtml).join("");
    emptyEl.style.display = list.length ? "none" : "block";

    listEl.querySelectorAll(".prod-card").forEach((el) => {
      const product = PRODUCTS.find((p) => p.id === el.dataset.id);
      if (!product || product.stock <= 0) return;      // 품절은 담을 수 없다
      el.querySelector(".pc-btn").addEventListener("click", () => {
        let cart = loadCart();
        const idx = cart.findIndex((c) => c.productId === product.id);
        if (idx >= 0) {
          cart.splice(idx, 1);
        } else {
          cart.push({ productId: product.id, itemName: product.item_name,
                      price: product.price, quantity: 1 });
        }
        saveCart(cart);
        renderProducts();          // 담김 표시를 다시 그린다
        renderCartSummary();
      });
    });
  }

  async function init() {
    try {
      PRODUCTS = await api("GET", `/vending/machines/${encodeURIComponent(machineId)}/products`);
    } catch (e) {
      alert("상품 목록을 불러오지 못했습니다: " + e.message);
      return;
    }
    renderProducts();
    renderCartSummary();
  }

  // ---------- 카테고리 탭 ----------
  document.querySelectorAll(".tabs-scroll > div").forEach((tabEl, i) => {
    tabEl.addEventListener("click", () => {
      activeCategory = TAB_CATEGORIES[i] || "전체";
      document.querySelectorAll(".tabs-scroll > div")
        .forEach((el, j) => el.classList.toggle("is-on", i === j));
      renderProducts();
    });
  });

  // ---------- 검색 ----------
  document.querySelector(".search-row").addEventListener("click", () => {
    const q = prompt("검색할 상품명을 입력해주세요 (예: 밴드, 마스크)", searchQuery);
    if (q === null) return;
    searchQuery = q.trim();
    renderProducts();
  });

  // ---------- 결제하기 ----------
  document.querySelector(".btn-next-step").addEventListener("click", () => {
    const cart = loadCart();
    if (cart.length === 0) {
      alert("담은 약품이 없습니다. 먼저 상품을 담아주세요.");
      return;
    }
    location.href = `/kiosk/cart/?machine=${encodeURIComponent(machineId)}`;
  });

  document.querySelector(".btn-back").addEventListener("click", () => {
    location.href = "/kiosk/main-home/";
  });

  init();
</script>
</body>
</html>
