<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="kiosk-main-home">
    <div class="content-wrapper">
      <div class="kiosk-header">
        <div class="header-left">
          <div class="logo-row">
            <div class="logo-badge">
              <div class="div">모두의 약</div>
            </div>
            <div class="div2">모약</div>
          </div>
          <div class="step-row">
            <div class="div3">시작하기</div>
            <div class="div4">| 원하시는 구매 방법을 선택해 주세요</div>
          </div>
        </div>
        <div class="header-right">
          <div class="lang-button">
            <div class="div5">한국어</div>
            <img class="chevron-down" src="chevron-down0.svg" />
          </div>
        </div>
      </div>
      <div class="hero-banner">
        <div class="div6">언제나 안심하는 비상약 자판기</div>
        <div class="_365-24-24">
          365일 24시간 스마트 비상 의약품 자판기 서비스 메디24입니다.
        </div>
      </div>
      <div class="routes-stack">
        <div class="route-card-0">
          <div class="card-left">
            <div class="icon-wrap">
              <img class="pill-bottle" src="pill-bottle0.svg" />
            </div>
            <div class="text-wrap">
              <div class="title-badge">
                <div class="div7">의약외품 즉시 구매</div>
                <div class="badge">
                  <div class="div8">인증 불필요</div>
                </div>
              </div>
              <div class="div9">
                밴드, 거즈, 마스크 등 의약외품을 본인인증 없이 간편하게 구매할 수
                있습니다.
              </div>
            </div>
          </div>
          <div class="arrow-wrap">
            <img class="arrow-right" src="arrow-right0.svg" />
          </div>
        </div>
        <div class="route-card-1">
          <div class="card-left">
            <div class="icon-wrap">
              <img class="shield-user" src="shield-user0.svg" />
            </div>
            <div class="text-wrap">
              <div class="title-badge">
                <div class="div7">본인인증 필요 약품 구매</div>
                <div class="badge2">
                  <div class="div10">본인인증</div>
                </div>
              </div>
              <div class="div9">
                모바일 앱 연동 및 간편 본인인증이 필요한 성인 의약품 및 제한 약품
                구매
              </div>
            </div>
          </div>
          <div class="arrow-wrap">
            <img class="arrow-right2" src="arrow-right1.svg" />
          </div>
        </div>
        <div class="route-card-12">
          <div class="card-left">
            <img class="icon-wrap2" src="icon-wrap2.svg" />
            <div class="text-wrap">
              <div class="title-badge">
                <div class="div7">앱 다운로드 및 사용 방법</div>
              </div>
              <div class="div9">
                모약 앱을 다운로드하고 다양한 서비스를 이용해 보세요.
              </div>
            </div>
          </div>
          <div class="arrow-wrap">
            <img class="arrow-right3" src="arrow-right2.svg" />
          </div>
        </div>
      </div>
    </div>
    <div class="kiosk-footer"></div>
  </div>
  
</body>
</html>
