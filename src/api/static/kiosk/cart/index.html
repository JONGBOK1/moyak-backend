<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>장바구니</title>
</head>
<body>
  <div class="kiosk-cart">
    <div class="header">
      <div class="title">장바구니</div>
      <div class="subtitle">담은 약품을 확인해 주세요</div>
    </div>

    <div class="cart-list" id="cartList"></div>

    <div class="summary">
      <div class="summary-row">
        <span>합계 금액</span>
        <span id="totalAmount">0원</span>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="addMoreBtn">+ 의약외품 추가하기</button>
        <button class="btn-primary" id="checkoutBtn">선택완료 및 결제하기</button>
      </div>
    </div>

    <div class="footer">
      <button class="btn-back" id="backBtn">← 이전으로</button>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const machineId = params.get("machine") || "M001";
  const CART_KEY = `moyak_kiosk_cart_${machineId}`;

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function loadCart() {
    try {
      return JSON.parse(sessionStorage.getItem(CART_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }
  function saveCart(cart) {
    sessionStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function render() {
    const cart = loadCart();
    const listEl = document.getElementById("cartList");
    listEl.innerHTML = "";
    if (cart.length === 0) {
      listEl.innerHTML = '<div class="empty">담은 약품이 없습니다.</div>';
    }
    cart.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <div class="item-name">${item.itemName}</div>
        <div class="qty-controls">
          <button class="qty-btn minus" data-i="${i}">-</button>
          <span class="qty">${item.quantity}</span>
          <button class="qty-btn plus" data-i="${i}">+</button>
        </div>
        <div class="line-total">${(item.price * item.quantity).toLocaleString()}원</div>
        <button class="remove-btn" data-i="${i}">삭제</button>
      `;
      listEl.appendChild(row);
    });

    const total = cart.reduce((sum, c) => sum + c.price * c.quantity, 0);
    document.getElementById("totalAmount").textContent = total.toLocaleString() + "원";

    listEl.querySelectorAll(".minus").forEach((btn) =>
      btn.addEventListener("click", () => changeQty(Number(btn.dataset.i), -1))
    );
    listEl.querySelectorAll(".plus").forEach((btn) =>
      btn.addEventListener("click", () => changeQty(Number(btn.dataset.i), 1))
    );
    listEl.querySelectorAll(".remove-btn").forEach((btn) =>
      btn.addEventListener("click", () => {
        const cart = loadCart();
        cart.splice(Number(btn.dataset.i), 1);
        saveCart(cart);
        render();
      })
    );
  }

  function changeQty(i, delta) {
    const cart = loadCart();
    cart[i].quantity = Math.max(1, cart[i].quantity + delta);
    saveCart(cart);
    render();
  }

  document.getElementById("addMoreBtn").addEventListener("click", () => {
    location.href = `/kiosk/otc-list/?machine=${encodeURIComponent(machineId)}`;
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    location.href = `/kiosk/otc-list/?machine=${encodeURIComponent(machineId)}`;
  });

  document.getElementById("checkoutBtn").addEventListener("click", async () => {
    const cart = loadCart();
    if (cart.length === 0) {
      alert("담은 약품이 없습니다.");
      return;
    }
    try {
      const order = await api("POST", `/vending/machines/${encodeURIComponent(machineId)}/orders`, {
        items: cart.map((c) => ({ product_id: c.productId, quantity: c.quantity })),
      });
      sessionStorage.removeItem(CART_KEY);
      location.href = `/kiosk/payment/?machine=${encodeURIComponent(machineId)}&order=${encodeURIComponent(order.id)}`;
    } catch (e) {
      alert("주문 생성에 실패했습니다: " + e.message);
    }
  });

  render();
</script>
</body>
</html>
