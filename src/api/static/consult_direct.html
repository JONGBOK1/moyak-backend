<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모약이 — 약사상담</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; text-align: center; }
  h1 { font-size: 20px; }
  .nav { font-size: 13px; margin-bottom: 24px; }
  .nav a { color: #1a56db; text-decoration: none; }
  .user-id { font-size: 12px; color: #999; margin-bottom: 24px; }
  .intro { color: #555; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
  .start-btn {
    background: #0c5460; color: #fff; border: none; border-radius: 10px;
    padding: 18px 32px; font-size: 18px; cursor: pointer;
  }
  .start-btn:disabled { opacity: 0.6; cursor: default; }
  .waiting { color: #856404; background: #fff3cd; padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-top: 20px; }
  .approved-note { color: #155724; background: #d4edda; }
  .rejected-note { color: #721c24; background: #f8d7da; }
  .video-wrap { margin-top: 20px; }
  .video-wrap iframe { width: 100%; height: 480px; border: 1px solid #ddd; border-radius: 10px; }
  .video-label { font-size: 12px; color: #888; margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>🩺 약사상담</h1>
  <div class="nav"><a href="/">💊 챗봇으로 돌아가기</a></div>
  <div class="user-id">내 사용자 ID: <span id="userIdLabel"></span></div>

  <div id="intro" class="intro">
    버튼을 누르면 바로 약사와 화상으로 연결됩니다.<br />
    (증상이나 궁금한 점은 화상으로 직접 말씀하시면 돼요)
  </div>

  <button id="startBtn" class="start-btn">🎥 약사와 화상 상담 시작하기</button>
  <div id="result"></div>

<script>
  const startBtn = document.getElementById("startBtn");
  const introEl = document.getElementById("intro");
  const resultEl = document.getElementById("result");
  const userIdLabelEl = document.getElementById("userIdLabel");

  // crypto.randomUUID()는 보안 컨텍스트(HTTPS/localhost)에서만 동작해서,
  // 로컬 네트워크 IP로 접속하는 개발 환경(http://192.168.x.x)에서는 쓸 수 없다.
  function makeUserId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  // chat_test.html과 동일한 키를 써서, 같은 브라우저라면 챗봇 쪽과 사용자 ID가 이어진다.
  let userId = localStorage.getItem("moyak_user_id");
  if (!userId) {
    userId = makeUserId();
    localStorage.setItem("moyak_user_id", userId);
  }
  userIdLabelEl.textContent = userId;

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  const POLL_INTERVAL_MS = 3000;
  let pollTimer = null;

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function renderConsultationOutcome(data) {
    if (data.status === "approved") {
      resultEl.appendChild(
        el("div", {
          className: "waiting approved-note",
          textContent:
            "🎉 약사가 [" + (data.approved_drug_name || "약") + "]을(를) 처방했습니다. " +
            "자판기에서 QR을 스캔하면 받으실 수 있어요.",
        })
      );
    } else if (data.status === "rejected") {
      const reasonText = data.decision_reason ? "사유: " + data.decision_reason : "사유가 별도로 전달되지 않았습니다.";
      resultEl.appendChild(el("div", { className: "waiting rejected-note", textContent: "상담이 거절되었습니다. " + reasonText }));
    }
  }

  function pollConsultationStatus(consultationId) {
    stopPolling();
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch("/consultations/" + consultationId);
        if (!res.ok) return;
        const data = await res.json();
        if (data.status !== "pending") {
          stopPolling();
          renderConsultationOutcome(data);
        }
      } catch (e) {
        // 네트워크 순단 등은 조용히 무시하고 다음 폴링에서 다시 시도한다.
      }
    }, POLL_INTERVAL_MS);
  }

  async function startConsultation() {
    startBtn.disabled = true;
    introEl.style.display = "none";
    startBtn.style.display = "none";

    const waiting = el("div", { className: "waiting", textContent: "약사 상담을 준비하고 있습니다. 잠시만 기다려주세요..." });
    resultEl.appendChild(waiting);

    try {
      // 이미 대기 중인 상담이 있으면 새로 만들지 않고 그걸 이어서 보여준다.
      const pendingRes = await fetch("/consultations?status=pending&user_id=" + encodeURIComponent(userId));
      const pendingList = pendingRes.ok ? await pendingRes.json() : [];

      let data;
      const reused = pendingList.length > 0;
      if (reused) {
        data = pendingList[0];
      } else {
        const res = await fetch("/consultations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      }

      waiting.remove();

      if (reused) {
        resultEl.appendChild(
          el("div", { className: "waiting", textContent: "이미 대기 중인 상담이 있어서 이어서 진행합니다. (요청 ID: " + data.id.slice(0, 8) + "...)" })
        );
      }

      if (data.room_url) {
        const videoWrap = el("div", { className: "video-wrap" });
        videoWrap.appendChild(
          el("div", { className: "video-label", textContent: "약사가 입장하면 화상 상담이 시작됩니다 (요청 ID: " + data.id.slice(0, 8) + "...)" })
        );
        videoWrap.appendChild(el("iframe", { src: data.room_url, allow: "camera; microphone; fullscreen; display-capture" }));
        resultEl.appendChild(videoWrap);
      } else {
        resultEl.appendChild(
          el("div", { className: "waiting", textContent: "화상 연결에 문제가 있습니다. 잠시 후 다시 시도해주세요. (요청 ID: " + data.id.slice(0, 8) + "...)" })
        );
      }

      pollConsultationStatus(data.id);
    } catch (e) {
      waiting.remove();
      resultEl.appendChild(el("div", { className: "waiting", textContent: "상담 요청 실패: " + e.message }));
      introEl.style.display = "block";
      startBtn.style.display = "inline-block";
      startBtn.disabled = false;
    }
  }

  startBtn.addEventListener("click", startConsultation);
</script>
</body>
</html>
