<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="frame-2">
    <div class="signup-step-3">
      <div class="signup-content">
        <div class="status-bar">
          <img class="time" src="time0.svg" />
          <div class="status-icons">
            <img class="ios-signal" src="ios-signal0.svg" />
            <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
            <img class="ios-battery-full" src="ios-battery-full0.svg" />
          </div>
        </div>
        <div class="top-header">
          <div class="back-icon-container" id="backBtn">
            <img class="chevron-left" src="chevron-left0.svg" />
          </div>
          <img class="div" src="div0.svg" />
        </div>
        <div class="signup-progress-section">
          <div class="step-label">
            <img class="div2" src="div1.svg" />
            <img class="_3-3" src="_3-30.svg" />
          </div>
          <img class="progress-bar-bg" src="progress-bar-bg0.svg" />
        </div>
        <div class="signup-body">
          <img class="div3" src="div2.svg" />
          <div class="card-stack">
            <div class="verif-card" id="emailCard">
              <div class="icon-block" id="emailIcon">
                <img class="mail" src="mail0.svg" />
              </div>
              <div class="text-block">
                <img class="div4" src="div3.svg" />
                <img class="div5" src="div4.svg" />
              </div>
              <div class="check-indicator" id="emailCheck">
                <img class="check" src="check0.svg" />
              </div>
            </div>
            <div class="verif-card2" id="shieldCard">
              <div class="icon-block2" id="shieldIcon">
                <img class="shield" src="shield0.svg" />
              </div>
              <div class="text-block">
                <img class="div6" src="div5.svg" />
                <img class="div7" src="div6.svg" />
              </div>
              <div class="check-indicator2" id="shieldCheck">
                <img class="check2" src="check1.svg" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="bottom-cta">
        <div class="primary-button" id="confirmBtn">
          <img class="div8" src="div7.svg" />
        </div>
        <img class="home-indicator-area" src="home-indicator-area0.svg" />
      </div>
    </div>
  </div>

<script>
  // 실제 본인인증 연동이 없어서(스텁 구간), 방법 선택 UI만 라디오 버튼처럼 동작시킨다.
  const SELECTED = { border: "#ffd54f", borderWidth: "2px", iconBg: "#fffde7", checkBg: "#ffd54f" };
  const UNSELECTED = { border: "#efebe9", borderWidth: "1px", iconBg: "#f5f5f3", checkBg: "#efebe9" };

  function applyState(cardEl, iconEl, checkEl, state) {
    cardEl.style.borderColor = state.border;
    cardEl.style.borderWidth = state.borderWidth;
    iconEl.style.background = state.iconBg;
    checkEl.style.background = state.checkBg;
  }

  let selectedMethod = "email"; // 디자인 기본값 = 이메일 인증 선택된 상태

  function render() {
    applyState(
      document.getElementById("emailCard"),
      document.getElementById("emailIcon"),
      document.getElementById("emailCheck"),
      selectedMethod === "email" ? SELECTED : UNSELECTED
    );
    applyState(
      document.getElementById("shieldCard"),
      document.getElementById("shieldIcon"),
      document.getElementById("shieldCheck"),
      selectedMethod === "shield" ? SELECTED : UNSELECTED
    );
  }

  document.getElementById("emailCard").addEventListener("click", () => {
    selectedMethod = "email";
    render();
  });
  document.getElementById("shieldCard").addEventListener("click", () => {
    selectedMethod = "shield";
    render();
  });

  document.getElementById("confirmBtn").addEventListener("click", () => {
    if (!localStorage.getItem("moyak_user_id")) {
      const uuid =
        window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
              const r = (Math.random() * 16) | 0;
              const v = c === "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            });
      localStorage.setItem("moyak_user_id", uuid);
    }
    location.href = "/app/onboarding-1/";
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    location.href = "/app/signup-step2/";
  });

  render();
</script>
</body>
</html>
