<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <style>
   /* 사진으로 약 찾기 (+ 버튼) — 아래 스크립트의 "사진으로 약 찾기" 참고 */
   .attach { flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; background: #f6f2e9;
             border: 1px solid #e4ddd2; color: #176b5b; font-size: 28px; font-weight: 700; line-height: 1;
             display: flex; align-items: center; justify-content: center; cursor: pointer; }
   .photo-bubble { display: flex; gap: 6px; }
   .photo-bubble img { width: 96px; height: 96px; object-fit: cover; border-radius: 12px; }
   .pill-cands { display: flex; flex-direction: column; gap: 8px; align-self: stretch; }
   .pill-cand { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px;
                border: 1px solid #e4ddd2; background: #fbf9f5; cursor: pointer; }
   .pill-cand.top { border-color: #176b5b; background: #eef6f3; }
   .pill-cand img { width: 76px; height: 42px; object-fit: contain; border-radius: 6px; background: #e9eef6; flex-shrink: 0; }
   .pill-cand .nm { font-weight: 700; font-size: 14px; color: #2b2420; }
   .pill-cand .meta { font-size: 12px; color: #7a6f66; margin-top: 2px; }
   .pill-cand .pick { display: inline-block; margin-top: 6px; font-size: 12.5px; color: #176b5b; font-weight: 700;
                      background: #e3f0ec; border-radius: 10px; padding: 4px 10px; }
   .pill-note { font-size: 12.5px; color: #8a5a1c; background: #fbf1e1; border-radius: 8px; padding: 6px 10px; }
   /* 카톡처럼 아래에서 올라오는 사진 선택 시트 */
   .photo-sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); z-index: 50;
                           display: none; align-items: flex-end; }
   .photo-sheet-backdrop.open { display: flex; }
   .photo-sheet { width: 100%; background: #ffffff; border-radius: 22px 22px 0 0; padding: 10px 18px 26px; }
   .sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: #d9d2c6; margin: 0 auto 12px; }
   .sheet-head { display: flex; align-items: center; justify-content: space-between; }
   .sheet-title { font-size: 17px; font-weight: 800; color: #2b2420; }
   .sheet-send { background: #176b5b; color: #fff; font-weight: 700; font-size: 14px; padding: 8px 16px;
                 border-radius: 18px; cursor: pointer; }
   .sheet-send.off { background: #d9d2c6; cursor: default; }
   .sheet-hint { font-size: 12.5px; color: #7a6f66; margin: 6px 0 12px; }
   .sheet-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
   .sheet-cam, .sheet-thumb { width: 104px; height: 104px; border-radius: 14px; flex-shrink: 0; position: relative; }
   .sheet-cam { background: #ece6db; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 4px; cursor: pointer; font-size: 30px; color: #55483f; }
   .sheet-cam span { font-size: 12px; font-weight: 700; }
   .sheet-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
   .sheet-thumb .order { position: absolute; top: 6px; left: 6px; background: #176b5b; color: #fff; font-size: 11px;
                         font-weight: 700; border-radius: 9px; padding: 2px 7px; }
   .sheet-thumb .del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 11px;
                       background: rgba(0, 0, 0, .55); color: #fff; font-size: 14px; line-height: 22px; text-align: center; cursor: pointer; }
   .sheet-item { display: flex; align-items: center; gap: 12px; padding: 14px 4px; font-size: 15px; color: #2b2420;
                 border-top: 1px solid #eee8dd; cursor: pointer; }
   .sheet-item .ico { font-size: 20px; }
  </style>
  <title>Document</title>
</head>
<body>
  <div class="div">
    <div class="header">
      <div class="device-status">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="app-bar">
        <div class="title-area">
          <div class="brand-mark">
            <img class="pill" src="pill0.svg" />
          </div>
          <div class="header-copy">
            <div class="title">모약이 챗봇</div>
            <div class="subtitle">의약품 정보를 쉽고 안전하게</div>
          </div>
        </div>
        <div class="qr-scan" id="qrScanBtn">
          <img class="scan-qr-code" src="scan-qr-code0.svg" />
          <div class="qr-scan-label">QR 스캔</div>
        </div>
      </div>
    </div>
    <div class="chat-area">
      <div class="conversation" id="conversation">
        <div class="trust-line">
          <div class="status-badge">
            <img class="shield-check" src="shield-check0.svg" />
            <div class="label">식품의약품안전처 공식 데이터 기반</div>
          </div>
          <div class="updated">오늘 업데이트</div>
        </div>
      </div>
      <div class="message-composer">
        <div class="attach" id="attachBtn" title="알약 사진으로 찾기">+</div>
        <div class="question-input">
          <img class="message-circle" src="message-circle0.svg" />
          <input class="placeholder" id="questionInput" type="text" placeholder="약이나 증상을 물어보세요" />
        </div>
        <div class="send" id="sendBtn">
          <img class="arrow-up" src="arrow-up0.svg" />
        </div>
      </div>
    </div>
    <div class="bottom-navigation">
      <div class="navigation-component">
        <div class="tabs-container">
          <div class="nav-tab" id="navHome">
            <img class="home" src="home0.svg" />
            <div class="div2">홈</div>
          </div>
          <div class="nav-tab2" id="navMap">
            <img class="map-pin" src="map-pin0.svg" />
            <div class="div3">주변약국</div>
          </div>
          <div class="qr-fab-container" id="navConsult">
            <div class="qr-fab"></div>
            <div class="frame"></div>
            <div class="qr">상담하기</div>
          </div>
          <div class="nav-tab3">
            <img class="message-circle2" src="message-circle1.svg" />
            <div class="div4">챗봇</div>
          </div>
          <div class="nav-tab4" id="navMypage">
            <img class="user-cog" src="user-cog0.svg" />
            <div class="div5">내정보</div>
          </div>
        </div>
        <div class="home-indicator-area">
          <div class="home-pill"></div>
        </div>
      </div>
      <img class="stethoscope2" src="stethoscope1.svg" />
    </div>
    <!-- 카톡처럼 "+" 를 누르면 아래에서 올라오는 사진 선택 시트. 앱(Flutter)에서는 카메라 칸 옆에
         최근 사진을 바로 보여주면 된다(웹은 보안상 사진첩을 직접 못 읽어서 "앨범에서 선택" 으로 대신한다). -->
    <div class="photo-sheet-backdrop" id="photoSheet">
      <div class="photo-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div class="sheet-title">알약 사진</div>
          <div class="sheet-send off" id="sheetSend">전송</div>
        </div>
        <div class="sheet-hint">한 알만 가까이 찍어 주세요. 같은 약의 <b>앞면·뒷면 두 장</b>이면 더 정확해요.</div>
        <div class="sheet-row" id="sheetRow">
          <label class="sheet-cam">📷<span>사진 찍기</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
          </label>
        </div>
        <label class="sheet-item"><span class="ico">🖼️</span>앨범에서 선택
          <input type="file" id="photoInput" accept="image/*" multiple hidden />
        </label>
        <div class="sheet-item" id="sheetCancel"><span class="ico">✕</span>닫기</div>
      </div>
    </div>
  </div>

<script>
  // 아직 실제 로그인/본인인증이 없어서, chat_test.html과 동일한 방식으로 임시 사용자 ID를 유지한다.
  function makeUserId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  let userId = localStorage.getItem("moyak_user_id");
  if (!userId) {
    userId = makeUserId();
    localStorage.setItem("moyak_user_id", userId);
  }

  let history = [];
  const conversationEl = document.getElementById("conversation");
  const questionInput = document.getElementById("questionInput");

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // 답변에 섞여 있는 **굵게**, 번호/불릿 목록을 실제 HTML로 바꿔서 가독성 있게 보여준다.
  function formatAnswer(text) {
    const escaped = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const lines = escaped.split(/\n+/).map((l) => l.trim()).filter(Boolean);
    let html = "";
    let inList = false;
    lines.forEach((line) => {
      const bullet = line.match(/^[-•]\s+(.*)/);
      const numbered = line.match(/^\d+[.)]\s+(.*)/);
      if (bullet || numbered) {
        if (!inList) {
          html += "<ul>";
          inList = true;
        }
        html += "<li>" + (bullet ? bullet[1] : numbered[1]) + "</li>";
      } else {
        if (inList) {
          html += "</ul>";
          inList = false;
        }
        html += "<p>" + line + "</p>";
      }
    });
    if (inList) html += "</ul>";
    return html;
  }

  // 증상 추천 답변: 서버가 나눠 준 recommendations로 약마다 카드를 그린다(약 이름 강조, 추천 이유 → 성분 → 주의 순).
  // 카드 앞의 안내 문장과 카드 뒤의 마무리 문장은 답변 원문에서 그대로 가져온다.
  function formatRecommendations(answer, recs) {
    const lines = (answer || "").split("\n").map((l) => l.trim()).filter(Boolean);
    const first = lines.findIndex((l) => l.startsWith("💊"));
    const intro = first > 0 ? lines.slice(0, first) : [];
    const outro = lines.filter((l) => /^(복용법이나|궁금한)/.test(l));
    const row = (icon, label, text) => text ? `<div class="rec-row"><span class="rec-label">${icon} ${label}</span><span>${escapeHtml(text)}</span></div>` : "";
    return intro.map((l) => `<p>${escapeHtml(l)}</p>`).join("") +
      recs.map((r) => `
        <div class="rec-card">
          <div class="rec-name"><span class="rec-rank">${r.rank}</span>${escapeHtml(r.item_name)}</div>
          ${row("✅", "추천 이유", r.reason)}
          ${row("🧪", "성분", r.ingredient)}
          ${row("⚠️", "주의", r.caution)}
        </div>`).join("") +
      outro.map((l) => `<p class="rec-outro">${escapeHtml(l)}</p>`).join("");
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function renderTurn(question, data) {
    const userMsg = el("div", { className: "user-message" }, [
      el("div", { className: "question-bubble" }, [el("div", { className: "question", textContent: question })]),
    ]);
    conversationEl.appendChild(userMsg);

    const answerCard = el("div", { className: "answer-card" });
    answerCard.innerHTML = `
      <div class="answer-heading">
        <div class="bot-identity">
          <div class="bot-icon"><img class="sparkles" src="sparkles0.svg" /></div>
          <div class="bot-name">모약이 답변</div>
        </div>
        <div class="status-badge2"><div class="indicator"></div><div class="label2">정보 안내</div></div>
      </div>
      <div class="summary formatted-answer"></div>
      <div class="safety-notice">
        <img class="triangle-alert" src="triangle-alert0.svg" />
        <div class="notice">정확한 진단과 복용은 약사와 상담하세요.</div>
      </div>
      <div class="answer-actions">
        <div class="evidence-link" style="display:${data.evidence && data.evidence.length ? "flex" : "none"}">
          <img class="book-open-text" src="book-open-text0.svg" />
          <div class="label3">원문 근거 보기 (${data.evidence ? data.evidence.length : 0})</div>
        </div>
        <div class="helpful"><img class="thumbs-up" src="thumbs-up0.svg" /><div class="label4">도움돼요</div></div>
      </div>
      <div class="sources-line"></div>
    `;
    answerCard.querySelector(".summary").innerHTML = data.recommendations && data.recommendations.length
      ? formatRecommendations(data.answer, data.recommendations)
      : formatAnswer(data.answer);
    answerCard.querySelector(".sources-line").textContent =
      "참고 약품: " + (data.sources && data.sources.length ? data.sources.join(", ") : "없음");

    if (data.evidence && data.evidence.length) {
      answerCard.querySelector(".evidence-link").addEventListener("click", () => {
        sessionStorage.setItem("moyak_last_evidence", JSON.stringify({ question, answer: data.answer, sources: data.sources, evidence: data.evidence }));
        location.href = "/app/evidence-detail/";
      });
    }
    answerCard.querySelector(".helpful").addEventListener("click", (e) => {
      e.currentTarget.classList.toggle("helpful-active");
    });

    conversationEl.appendChild(answerCard);

    const consultBtn = el("div", { className: "primary-button" });
    consultBtn.innerHTML = `<img class="stethoscope" src="stethoscope0.svg" /><div class="label5">약사에게 바로 상담하기</div>`;
    consultBtn.addEventListener("click", requestConsultation);
    conversationEl.appendChild(consultBtn);

    conversationEl.scrollTop = conversationEl.scrollHeight;
  }

  async function ask() {
    const question = questionInput.value.trim();
    if (!question) return;
    questionInput.value = "";
    questionInput.disabled = true;

    const loading = el("div", { className: "system-note", textContent: "답변중입니다..." });
    conversationEl.appendChild(loading);
    conversationEl.scrollTop = conversationEl.scrollHeight;

    try {
      const data = await api("POST", "/chat", { question, history });
      loading.remove();
      renderTurn(question, data);
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: data.answer });
    } catch (e) {
      loading.remove();
      conversationEl.appendChild(el("div", { className: "system-note", textContent: "오류: " + e.message }));
    } finally {
      questionInput.disabled = false;
      questionInput.focus();
    }
  }

  document.getElementById("sendBtn").addEventListener("click", ask);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
  });

  // ---------- 사진으로 약 찾기 (+ 버튼) ----------
  // 사진(한 장, 또는 앞면·뒷면 두 장) → /pills/identify → 후보 카드 → 사용자가 고른 약 이름으로 /chat 질문.
  // **1위를 정답으로 단정하지 않는다** — 사진만으로는 틀릴 수 있어서(실사진 3위 안 약 71%) 사용자가 고르게 하고,
  // 약 설명은 기존 챗봇(/chat, 식약처 자료 기반)이 그대로 한다. API 설명은 docs/pills-api.md.
  // 카톡식 시트: "+" → 사진 찍기/앨범에서 고르기(최대 2장, 같은 약 앞·뒤) → 전송.
  const MAX_PHOTOS = 2;
  const sheet = document.getElementById("photoSheet");
  const sheetRow = document.getElementById("sheetRow");
  const sheetSend = document.getElementById("sheetSend");
  let picked = [];

  function renderSheet() {
    sheetRow.querySelectorAll(".sheet-thumb").forEach((n) => n.remove());
    picked.forEach((f, i) => {
      const t = el("div", { className: "sheet-thumb" });
      t.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="" /><span class="order">${i === 0 ? "앞" : "뒤"}</span><span class="del">×</span>`;
      t.querySelector(".del").addEventListener("click", () => { picked.splice(i, 1); renderSheet(); });
      sheetRow.appendChild(t);
    });
    sheetSend.classList.toggle("off", picked.length === 0);
    sheetSend.textContent = picked.length ? `전송 ${picked.length}` : "전송";
  }
  function openSheet() { picked = []; renderSheet(); sheet.classList.add("open"); }
  function closeSheet() { sheet.classList.remove("open"); }
  function addPhotos(input) {
    picked = picked.concat([...input.files]).slice(0, MAX_PHOTOS);
    input.value = "";
    renderSheet();
  }

  document.getElementById("attachBtn").addEventListener("click", openSheet);
  document.getElementById("photoInput").addEventListener("change", (e) => addPhotos(e.target));
  document.getElementById("cameraInput").addEventListener("change", (e) => addPhotos(e.target));
  document.getElementById("sheetCancel").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  sheetSend.addEventListener("click", () => {
    if (!picked.length) return;
    const files = picked;
    closeSheet();
    sendPhotos(files);
  });

  async function sendPhotos(files) {

    conversationEl.appendChild(el("div", { className: "user-message" }, [
      el("div", { className: "photo-bubble" }, files.map((f) => el("img", { src: URL.createObjectURL(f) }))),
    ]));
    const loading = el("div", { className: "system-note", textContent: "사진에서 약을 찾는 중이에요... (5~15초)" });
    conversationEl.appendChild(loading);
    conversationEl.scrollTop = conversationEl.scrollHeight;

    const fd = new FormData();
    files.forEach((f) => fd.append("files", f));     // 고른 순서대로: 앞면, 뒷면
    try {
      // 챗봇에서는 전문의약품까지 찾는다(otc_only=false) — 집에 있는 처방약을 묻는 경우가 많다.
      const res = await fetch("/pills/identify?otc_only=false&limit=3", { method: "POST", body: fd });
      const data = await res.json();
      loading.remove();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      renderPillResult(data);
    } catch (e) {
      loading.remove();
      conversationEl.appendChild(el("div", { className: "system-note", textContent: "오류: " + e.message }));
    }
  }

  function renderPillResult(data) {
    const card = el("div", { className: "answer-card" });
    card.innerHTML = `
      <div class="answer-heading">
        <div class="bot-identity">
          <div class="bot-icon"><img class="sparkles" src="sparkles0.svg" /></div>
          <div class="bot-name">사진으로 찾은 약</div>
        </div>
      </div>
      <div class="summary formatted-answer"><p>${escapeHtml(data.message || "")}</p></div>
      ${data.note ? `<div class="pill-note">${escapeHtml(data.note)}</div>` : ""}
      <div class="pill-cands"></div>
      <div class="safety-notice">
        <img class="triangle-alert" src="triangle-alert0.svg" />
        <div class="notice">사진만으로는 틀릴 수 있어요. 포장이나 약사에게 꼭 확인하세요.</div>
      </div>`;
    const list = card.querySelector(".pill-cands");
    (data.candidates || []).forEach((c, i) => {
      const imprint = [c.print_front, c.print_back].filter(Boolean).join(" / ");
      const item = el("div", { className: "pill-cand" + (i === 0 && data.confident ? " top" : "") });
      item.innerHTML = `
        ${c.item_image ? `<img src="${escapeHtml(c.item_image)}" alt="" loading="lazy" />` : ""}
        <div>
          <div class="nm">${escapeHtml(c.item_name)}</div>
          <div class="meta">${escapeHtml([c.entp_name, c.etc_otc_name, imprint && "각인 " + imprint].filter(Boolean).join(" · "))}</div>
          <div class="pick">이 약에 대해 설명해 주세요 ›</div>
        </div>`;
      // 고른 약 이름으로 챗봇에 묻는다. 이후 "부작용은?" 같은 후속 질문도 기존 대화처럼 이어진다.
      item.addEventListener("click", () => {
        questionInput.value = `${c.item_name}에 대해 설명해 주세요. 효능이랑 주의사항도 알려 주세요.`;
        ask();
      });
      list.appendChild(item);
    });
    conversationEl.appendChild(card);
    conversationEl.scrollTop = conversationEl.scrollHeight;
  }

  // ---------- 약사 상담 ----------
  // 실제 요청/대기 상태 폴링은 전용 화면(/app/pharmacist-waiting/)에서 처리한다.
  function requestConsultation() {
    if (history.length === 0) {
      alert("먼저 챗봇과 증상/약에 대해 대화해주세요. 그 대화 내용이 약사에게 전달됩니다.");
      return;
    }
    const chatSummary = history.map((h) => (h.role === "user" ? "사용자: " : "모약이: ") + h.content).join("\n");
    sessionStorage.setItem("moyak_pending_chat_summary", chatSummary);
    location.href = "/app/pharmacist-waiting/";
  }

  // ---------- 상단/하단 네비게이션 ----------
  document.getElementById("qrScanBtn").addEventListener("click", () => {
    location.href = "/app/qr-camera/";
  });
  document.getElementById("navHome").addEventListener("click", () => {
    location.href = "/app/main-home-disconnected/";
  });
  document.getElementById("navMap").addEventListener("click", () => {
    location.href = "/app/map-screen/";
  });
  // 하단 "약사상담" 버튼: 챗봇 대화 없이 바로 약사 화상 상담으로.
  // (대화 중 나오는 "약사에게 바로 상담하기" 버튼은 지금까지의 대화를 약사에게 함께 전달한다)
  document.getElementById("navConsult").addEventListener("click", () => {
    location.href = "/app/pharmacist-waiting/?direct=1";
  });
  document.getElementById("navMypage").addEventListener("click", () => {
    location.href = "/app/mypage/";
  });
</script>
</body>
</html>
