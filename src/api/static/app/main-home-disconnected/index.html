<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="main-home-disconnected">
    <div class="screen-content">
      <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="home-header">
        <div class="moyak">MOYAK</div>
      </div>
      <div class="home-body">
        <div class="mini-ad-banner">
          <div class="banner-text">
            <div class="div">급한 의약품이 있다면? 자판기에서 바로!</div>
            <div class="div2">
              약품 정보부터 비대면 의약품 화상 상담까지 스마트하게
            </div>
          </div>
          <div class="pagination-badge">
            <div class="_1-4">1/4</div>
          </div>
        </div>
        <div class="content-bg-card">
          <div class="connection-badge">
            <div class="indicator-dot"></div>
            <div class="div3">자판기 연결 없음</div>
          </div>
          <img class="_2" src="_20.png" />
          <div class="status-text">
            <div class="div4">가까운 자판기가 있나요?</div>
            <div class="div5">
              스마트 기기와 자판기를 연동하고 안전하게 의약품을 처방 및
              결제하세요.
            </div>
          </div>
          <div class="line"></div>
          <div class="btn-rescan" id="rescanBtn">
            <img class="refresh-cw" src="refresh-cw0.svg" />
            <div class="div6">기기 재탐색</div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom-navbar">
      <div class="tabs-container">
        <div class="nav-tab" id="navHome">
          <img class="home" src="home0.svg" />
          <div class="div7">메인</div>
        </div>
        <div class="nav-tab2" id="navMap">
          <img class="map-pin" src="map-pin0.svg" />
          <div class="div8">지도</div>
        </div>
        <div class="qr-fab-container" id="navQr">
          <div class="qr-fab">
            <img class="scan-qr-code" src="scan-qr-code0.svg" />
          </div>
          <div class="frame"></div>
          <div class="qr">QR스캔</div>
        </div>
        <div class="nav-tab3" id="navChatbot">
          <img class="message-circle" src="message-circle0.svg" />
          <div class="div9">모약이</div>
        </div>
        <div class="nav-tab4" id="navMypage">
          <img class="user-cog" src="user-cog0.svg" />
          <div class="div8">마이</div>
        </div>
      </div>
      <div class="home-indicator-area">
        <div class="home-pill"></div>
      </div>
    </div>
  </div>

<script>
  // 기기 재탐색 = 실제로는 자판기 QR을 스캔해서 연동하는 흐름으로 안내
  document.getElementById("rescanBtn").addEventListener("click", () => {
    location.href = "/app/qr-camera/";
  });

  document.getElementById("navMap").addEventListener("click", () => {
    location.href = "/app/map-screen/";
  });
  document.getElementById("navQr").addEventListener("click", () => {
    location.href = "/app/qr-camera/";
  });
  document.getElementById("navChatbot").addEventListener("click", () => {
    location.href = "/app/chatbot/";
  });
  document.getElementById("navMypage").addEventListener("click", () => {
    location.href = "/app/mypage/";
  });
</script>
</body>
</html>
