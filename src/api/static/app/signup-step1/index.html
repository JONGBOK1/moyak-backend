<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="signup-step-1">
    <div class="signup-content">
      <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="top-header">
        <div class="back-icon-container" id="backBtn">
          <img class="chevron-left" src="chevron-left0.svg" />
        </div>
        <div class="div">회원가입</div>
        <div class="rectangle"></div>
      </div>
      <div class="signup-progress-section">
        <div class="step-label">
          <div class="div2">아이디 설정</div>
          <div class="_1-3">1 / 3</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
      <div class="signup-body">
        <div class="input-group">
          <div class="div3">사용하실 아이디를 입력해주세요</div>
          <div class="input-and-button">
            <div class="input-wrapper">
              <input class="moyak-user-12" id="usernameInput" type="text" placeholder="아이디를 입력해주세요" />
            </div>
            <div class="btn-dup" id="dupCheckBtn">
              <div class="div4">중복확인</div>
            </div>
          </div>
          <div class="div5" id="dupResult" style="display:none">✓ 사용 가능한 아이디입니다.</div>
        </div>
      </div>
    </div>
    <div class="bottom-cta">
      <div class="primary-button" id="nextBtn">
        <div class="div6">다음</div>
      </div>
      <div class="home-indicator-area">
        <div class="home-pill"></div>
      </div>
    </div>
  </div>

<script>
  // 실제 회원가입 백엔드가 없어서(스텁 구간), 아이디 입력만 받고 중복확인은 항상 통과시킨다.
  let usernameChecked = false;

  document.getElementById("dupCheckBtn").addEventListener("click", () => {
    const value = document.getElementById("usernameInput").value.trim();
    if (!value) {
      alert("아이디를 입력해주세요.");
      return;
    }
    usernameChecked = true;
    document.getElementById("dupResult").style.display = "block";
  });

  document.getElementById("usernameInput").addEventListener("input", () => {
    usernameChecked = false;
    document.getElementById("dupResult").style.display = "none";
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    const value = document.getElementById("usernameInput").value.trim();
    if (!value) {
      alert("아이디를 입력해주세요.");
      return;
    }
    if (!usernameChecked) {
      alert("중복확인을 먼저 진행해주세요.");
      return;
    }
    sessionStorage.setItem("moyak_signup_username", value);
    location.href = "/app/signup-step2/";
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    location.href = "/app/login/";
  });
</script>
</body>
</html>
