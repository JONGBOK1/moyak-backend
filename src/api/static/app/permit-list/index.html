<!DOCTYPE html>
<html lang="en">
<head>
<script src="/moyak-unified.js"></script>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="permit-list">
    <div class="screen-content">
      <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="sub-header">
        <div class="back-btn" id="backBtn">
          <img class="chevron-left" src="chevron-left0.svg" />
        </div>
        <div class="header-title">전자 구매 허가서</div>
        <div class="spacer"></div>
      </div>
      <div class="permit-list-container" id="permitList"></div>
    </div>
    <div class="bottom-navbar">
      <div class="tabs-container">
        <div class="nav-tab" id="navHome">
          <img class="home" src="home0.svg" />
          <div class="div6">메인</div>
        </div>
        <div class="nav-tab2" id="navMap">
          <img class="map-pin" src="map-pin0.svg" />
          <div class="div7">지도</div>
        </div>
        <div class="qr-fab-container" id="navConsult">
          <div class="qr-fab">
            <img class="scan-qr-code" src="fab-stethoscope.svg" />
          </div>
          <div class="frame"></div>
          <div class="qr">상담하기</div>
        </div>
        <div class="nav-tab3" id="navChatbot">
          <img class="message-circle" src="message-circle0.svg" />
          <div class="div8">모약이</div>
        </div>
        <div class="nav-tab4" id="navMypage">
          <img class="user-cog" src="user-cog0.svg" />
          <div class="div7">마이</div>
        </div>
      </div>
      <div class="home-indicator-area">
        <div class="home-pill"></div>
      </div>
    </div>
  </div>

<script>
  const userId = localStorage.getItem("moyak_user_id");
  const STATUS_LABELS = { pending: "사용 가능", expired: "기간 만료", dispensed: "수령 완료", cancelled: "취소됨" };

  function fmtDate(iso) {
    const d = new Date(iso + "Z");
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  }

  async function load() {
    const listEl = document.getElementById("permitList");
    if (!userId) {
      listEl.innerHTML = '<p style="padding:20px;color:#8a7a70;">로그인 정보가 없습니다.</p>';
      return;
    }
    listEl.innerHTML = '<p style="padding:20px;color:#8a7a70;">불러오는 중...</p>';
    try {
      const res = await fetch("/vending/purchases?user_id=" + encodeURIComponent(userId));
      const purchases = await res.json();
      if (!res.ok) throw new Error(purchases.detail || "조회에 실패했습니다.");

      if (purchases.length === 0) {
        listEl.innerHTML = '<p style="padding:20px;color:#8a7a70;">아직 발급된 전자 구매 허가서가 없습니다. 약사 상담을 통해 승인을 받으면 여기에 표시돼요.</p>';
        return;
      }

      listEl.innerHTML = "";
      purchases.forEach((p) => {
        const isActive = p.status === "pending";
        const card = document.createElement("div");
        card.className = "permit-card-0";
        if (!isActive) card.style.borderColor = "#efebe9";
        card.innerHTML = `
          <div class="card-header">
            <div class="badge-left">
              <img class="file-check" src="file-check0.svg" />
              <div class="_500-mg"></div>
            </div>
            <div class="${isActive ? "status-pill" : "status-pill2"}">
              <div class="div"></div>
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="card-body-meta">
            <div class="meta-row">
              <div class="div2">유효기간</div>
              <div class="_2025-01-15-2025-07-15"></div>
            </div>
            <div class="meta-row">
              <div class="div2">발급 약사</div>
              <div class="div3"></div>
            </div>
          </div>
        `;
        card.querySelector("._500-mg").textContent = p.drug_item_name;
        card.querySelector(".card-header > div:last-child > div").textContent = STATUS_LABELS[p.status] || p.status;
        card.querySelector("._2025-01-15-2025-07-15").textContent = fmtDate(p.created_at) + " ~ " + fmtDate(p.expires_at);
        card.querySelector(".div3").textContent = p.approved_by;
        listEl.appendChild(card);
      });
    } catch (e) {
      listEl.innerHTML = '<p style="padding:20px;color:#c0392b;">오류: ' + e.message + "</p>";
    }
  }

  document.getElementById("backBtn").addEventListener("click", () => {
    location.href = "/app/mypage/";
  });
  document.getElementById("navHome").addEventListener("click", () => {
    location.href = "/app/main-home-disconnected/";
  });
  document.getElementById("navMap").addEventListener("click", () => {
    location.href = "/app/map-screen/";
  });
  // 하단 가운데 "상담하기": 챗봇 대화 없이 바로 약사 화상 상담으로
  document.getElementById("navConsult").addEventListener("click", () => {
    location.href = "/app/pharmacist-waiting/?direct=1";
  });
  document.getElementById("navChatbot").addEventListener("click", () => {
    location.href = "/app/chatbot/";
  });
  document.getElementById("navMypage").addEventListener("click", () => {
    location.href = "/app/mypage/";
  });

  load();
</script>
</body>
</html>
