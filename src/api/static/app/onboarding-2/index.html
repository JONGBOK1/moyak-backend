<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="onboarding-2">
    <img class="main-home-connected-2" src="main-home-connected-20.png" />
    <div class="onboarding-content">
      <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="top-skip-row">
        <div class="btn-skip" id="skipBtn">
          <div class="div">건너뛰기</div>
        </div>
      </div>
      <div class="text-block">
        <div class="ai">AI 챗봇 모약이에게 물어보세요</div>
        <div class="div2">
          약품 정보와 증상 상담을 쉽고 편리하게 받을 수 있어요.
        </div>
      </div>
    </div>
    <div class="group-4">
      <div class="group-2">
        <div class="rectangle-42"></div>
      </div>
    </div>
    <div class="group-4">
      <div class="bottom-carousel-controls">
        <div class="page-dots">
          <div class="dot-1"></div>
          <div class="dot-2"></div>
          <div class="dot-3"></div>
          <div class="dot-4"></div>
        </div>
        <div class="cta-padding">
          <div class="primary-button" id="nextBtn">
            <div class="div3">다음</div>
          </div>
          <div class="home-indicator-area">
            <div class="home-pill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  document.getElementById("skipBtn").addEventListener("click", () => {
    location.href = "/app/main-home-disconnected/";
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    location.href = "/app/onboarding-3/";
  });
</script>
</body>
</html>
