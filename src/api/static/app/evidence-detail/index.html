<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow-x: hidden; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="div">
    <div class="header">
      <div class="device-status">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="app-bar">
        <div class="title-area">
          <div class="back" id="backBtn">
            <img class="chevron-left" src="chevron-left0.svg" />
          </div>
          <div class="header-copy">
            <div class="title">원문 근거</div>
            <div class="subtitle">답변에 사용된 공식 정보</div>
          </div>
        </div>
        <div class="qr-scan" id="qrScanBtn">
          <img class="scan-qr-code" src="scan-qr-code0.svg" />
          <div class="qr-scan-label">QR 스캔</div>
        </div>
      </div>
    </div>
    <div class="evidence-content">
      <div class="evidence-trust">
        <div class="status-badge">
          <img class="badge-check" src="badge-check0.svg" />
          <div class="label">공식 의약품 정보</div>
        </div>
        <div class="reading-time">
          <img class="clock-3" src="clock-30.svg" />
          <div class="reading-label" id="readingLabel">약 1분</div>
        </div>
      </div>
      <div class="evidence-summary">
        <div class="section-label">답변 근거 요약</div>
        <div class="summary-title" id="summaryTitle"></div>
        <div class="summary-copy" id="summaryCopy"></div>
      </div>
      <div id="medicineList"></div>
      <div class="when-to-seek-care">
        <div class="care-heading">
          <img class="heart-pulse" src="heart-pulse0.svg" />
          <div class="heading">진료가 필요한 경우</div>
        </div>
        <div class="care-copy">
          증상이 3일 이상 지속되거나 악화되면, 또는 평소 복용 중인 약이 있다면
          자가 판단으로 복용하지 말고 약사 또는 의사와 상담하세요.
        </div>
      </div>
      <div class="sources">
        <div class="source-title">
          <img class="library" src="library0.svg" />
          <div class="heading">출처</div>
        </div>
        <div class="divider"></div>
        <div class="source" id="sourceText"></div>
        <div class="updated" id="updatedText"></div>
      </div>
    </div>
    <div class="bottom-navigation">
      <div class="navigation-component">
        <div class="tabs-container">
          <div class="nav-tab" id="navHome">
            <img class="home" src="home0.svg" />
            <div class="div2">홈</div>
          </div>
          <div class="nav-tab2" id="navMap">
            <img class="map-pin" src="map-pin0.svg" />
            <div class="div3">주변약국</div>
          </div>
          <div class="qr-fab-container" id="navConsult">
            <div class="qr-fab"></div>
            <div class="frame"></div>
            <div class="qr">상담하기</div>
          </div>
          <div class="nav-tab3" id="navChatbot">
            <img class="message-circle" src="message-circle0.svg" />
            <div class="div4">챗봇</div>
          </div>
          <div class="nav-tab4" id="navMypage">
            <img class="user-cog" src="user-cog0.svg" />
            <div class="div5">내정보</div>
          </div>
        </div>
        <div class="home-indicator-area">
          <div class="home-pill"></div>
        </div>
      </div>
      <img class="stethoscope" src="stethoscope0.svg" />
    </div>
  </div>

<script>
  // chatbot 화면에서 "원문 근거 보기" 클릭 시 sessionStorage에 담아 넘겨준 답변 데이터를 읽는다.
  let payload = null;
  try {
    payload = JSON.parse(sessionStorage.getItem("moyak_last_evidence") || "null");
  } catch (e) {
    payload = null;
  }

  // "dur" = 식약처 허가정보·DUR(병용금기/임부금기 등) 보강 근거 — 안전 정보라 주의 박스로 표시
  const CAUTION_FIELDS = new Set(["warning", "precaution", "interaction", "side_effect", "dur"]);
  const FIELD_LABELS = {
    efficacy: "효능",
    usage: "사용법",
    warning: "경고",
    precaution: "주의사항",
    interaction: "상호작용",
    side_effect: "부작용",
    storage: "보관법",
  };

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // 답변에 섞여 있는 **굵게**, 번호/불릿 목록을 실제 HTML로 바꿔서 가독성 있게 보여준다.
  function formatAnswer(text) {
    const escaped = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const lines = escaped.split(/\n+/).map((l) => l.trim()).filter(Boolean);
    let html = "";
    let inList = false;
    lines.forEach((line) => {
      const bullet = line.match(/^[-•]\s+(.*)/);
      const numbered = line.match(/^\d+[.)]\s+(.*)/);
      if (bullet || numbered) {
        if (!inList) {
          html += "<ul>";
          inList = true;
        }
        html += "<li>" + (bullet ? bullet[1] : numbered[1]) + "</li>";
      } else {
        if (inList) {
          html += "</ul>";
          inList = false;
        }
        html += "<p>" + line + "</p>";
      }
    });
    if (inList) html += "</ul>";
    return html;
  }

  document.getElementById("summaryCopy").classList.add("formatted-answer");

  if (!payload || !payload.evidence || payload.evidence.length === 0) {
    document.getElementById("summaryTitle").textContent = "표시할 원문 근거가 없습니다";
    document.getElementById("summaryCopy").textContent = "챗봇 화면에서 질문에 대한 답변을 먼저 받아주세요.";
    document.getElementById("sourceText").textContent = "-";
    document.getElementById("updatedText").textContent = "";
  } else {
    document.getElementById("summaryTitle").textContent = payload.question || "질문에 대한 근거 자료";
    document.getElementById("summaryCopy").innerHTML = formatAnswer(payload.answer || "");
    document.getElementById("readingLabel").textContent = "약 " + Math.max(1, Math.round(payload.evidence.length / 2)) + "분";

    // item_name별로 근거를 묶어서, 주의/경고성 필드는 caution 박스로, 나머지는 details로 나눈다.
    const grouped = {};
    payload.evidence.forEach((e) => {
      if (!grouped[e.item_name]) grouped[e.item_name] = [];
      grouped[e.item_name].push(e);
    });

    const listEl = document.getElementById("medicineList");
    Object.keys(grouped).forEach((itemName) => {
      const items = grouped[itemName];
      const cautionItems = items.filter((e) => CAUTION_FIELDS.has(e.field));
      const detailItems = items.filter((e) => !CAUTION_FIELDS.has(e.field));

      const block = el("div", { className: "medicine-evidence" });
      block.innerHTML = `
        <div class="medicine-heading">
          <div class="medicine-title">
            <div class="medicine-icon"><img class="pill" src="pill0.svg" /></div>
            <div class="name"></div>
          </div>
          <div class="status-badge2"><div class="indicator"></div><div class="label2"></div></div>
        </div>
        <div class="details"></div>
      `;
      block.querySelector(".name").textContent = itemName;
      block.querySelector(".label2").textContent = FIELD_LABELS[items[0].field] || items[0].field_label;
      block.querySelector(".details").textContent = (detailItems.length ? detailItems : items)
        .map((e) => e.text)
        .join(" ");

      if (cautionItems.length) {
        const caution = el("div", { className: "caution" });
        caution.innerHTML = `<img class="circle-alert" src="circle-alert0.svg" /><div class="caution-text"></div>`;
        caution.querySelector(".caution-text").textContent = cautionItems.map((e) => e.text).join(" ");
        block.appendChild(caution);
      }
      listEl.appendChild(block);
    });

    const usedDur = payload.evidence.some((e) => e.field === "dur" || e.field === "permission");
    document.getElementById("sourceText").textContent =
      "식품의약품안전처 e약은요" + (usedDur ? " · 의약품 허가정보·DUR" : "") +
      " · 참고 약품: " + (payload.sources && payload.sources.length ? payload.sources.join(", ") : "-");
    document.getElementById("updatedText").textContent = "최종 확인 " + new Date().toLocaleDateString("ko-KR");
  }

  document.getElementById("backBtn").addEventListener("click", () => {
    history.length > 1 ? history.back() : (location.href = "/app/chatbot/");
  });
  document.getElementById("qrScanBtn").addEventListener("click", () => {
    location.href = "/app/qr-camera/";
  });
  document.getElementById("navHome").addEventListener("click", () => {
    location.href = "/app/main-home-disconnected/";
  });
  document.getElementById("navMap").addEventListener("click", () => {
    location.href = "/app/map-screen/";
  });
  // 하단 "약사상담" 버튼: 챗봇 대화 없이 바로 약사 화상 상담으로
  document.getElementById("navConsult").addEventListener("click", () => {
    location.href = "/app/pharmacist-waiting/?direct=1";
  });
  document.getElementById("navChatbot").addEventListener("click", () => {
    location.href = "/app/chatbot/";
  });
  document.getElementById("navMypage").addEventListener("click", () => {
    location.href = "/app/mypage/";
  });
</script>
</body>
</html>
