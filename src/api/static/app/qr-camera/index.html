<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
  </style>
  <script src="/static/vendor/app-scale.js"></script>
  <link rel="stylesheet" href="./vars.css">
  <link rel="stylesheet" href="./style.css">
  
  
  <style>
   a,
   button,
   input,
   select,
   h1,
   h2,
   h3,
   h4,
   h5,
   * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
       border: none;
       text-decoration: none;
       background: none;
   
       -webkit-font-smoothing: antialiased;
   }
   
   menu, ol, ul {
       list-style-type: none;
       margin: 0;
       padding: 0;
   }
   </style>
  <title>Document</title>
</head>
<body>
  <div class="qr-camera">
    <div class="bottom-action-bar">
      <div class="btn-flash" id="flashBtn">
        <img class="lightbulb-off" src="lightbulb-off0.svg" />
      </div>
      <div class="home-indicator-area">
        <div class="home-pill"></div>
      </div>
    </div>
    <div class="screen-content">
      <div class="status-bar">
        <div class="time">9:41</div>
        <div class="status-icons">
          <img class="ios-signal" src="ios-signal0.svg" />
          <img class="ios-wifi-signal" src="ios-wifi-signal0.svg" />
          <img class="ios-battery-full" src="ios-battery-full0.svg" />
        </div>
      </div>
      <div class="camera-header">
        <img class="chevron-left" src="chevron-left0.svg" id="backBtn" />
        <div class="header-title">QR 스캔</div>
        <div class="spacer"></div>
      </div>
      <div class="camera-body">
        <div class="instruction-text">
          <div class="qr" id="instructionMain">QR 코드를 스캔하세요</div>
          <div class="qr2" id="instructionSub">자판기 화면의 QR 코드를 비추면 연동됩니다</div>
        </div>
        <div class="scan-guideline-wrapper">
          <video class="simulated-viewfinder" id="video" playsinline autoplay muted></video>
          <div class="laser-scan-line" id="laserLine"></div>
        </div>
      </div>
    </div>
  </div>
  <canvas id="canvas" style="display:none"></canvas>

<script src="/static/vendor/jsQR.js"></script>
<script>
  // crypto.randomUUID()와 마찬가지로 getUserMedia도 보안 컨텍스트(HTTPS/localhost)에서만 동작한다.
  function makeUserId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  let userId = localStorage.getItem("moyak_user_id");
  if (!userId) {
    userId = makeUserId();
    localStorage.setItem("moyak_user_id", userId);
  }

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const instructionMain = document.getElementById("instructionMain");
  const instructionSub = document.getElementById("instructionSub");
  const laserLine = document.getElementById("laserLine");

  let scanning = false;
  let rafId = null;
  let stream = null;
  let torchOn = false;

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      instructionMain.textContent = "카메라를 사용할 수 없습니다";
      instructionSub.textContent = "HTTPS 연결(배포 주소)에서만 카메라를 쓸 수 있어요.";
      laserLine.style.display = "none";
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      await video.play();
      scanning = true;
      tick();
    } catch (e) {
      instructionMain.textContent = "카메라 접근에 실패했습니다";
      instructionSub.textContent = e.message;
      laserLine.style.display = "none";
    }
  }

  function stopCamera() {
    scanning = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach((t) => t.stop());
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        onDecoded(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  async function onDecoded(text) {
    stopCamera();
    laserLine.style.display = "none";
    let payload;
    try {
      payload = JSON.parse(text);
    } catch (e) {
      instructionMain.textContent = "자판기 QR이 아닙니다";
      instructionSub.textContent = "다시 스캔해주세요.";
      setTimeout(() => location.reload(), 1500);
      return;
    }

    instructionMain.textContent = "연동 확인 중...";
    instructionSub.textContent = "";
    try {
      const data = await api("POST", "/vending/scan", {
        machine_id: payload.machine_id,
        qr_token: payload.qr_token,
        user_id: userId,
      });
      instructionMain.textContent = "✅ 연동 완료!";
      instructionSub.textContent = data.has_pending_purchase
        ? `승인된 약품(${data.purchase.drug_item_name})을 자판기에서 수령하실 수 있어요.`
        : "자판기 화면에서 이어서 진행해주세요.";
      setTimeout(() => {
        location.href = "/app/main-home-connected/";
      }, 1800);
    } catch (e) {
      instructionMain.textContent = "스캔에 실패했습니다";
      instructionSub.textContent = e.message;
      setTimeout(() => location.reload(), 2000);
    }
  }

  document.getElementById("flashBtn").addEventListener("click", async () => {
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    } catch (e) {
      // 기기/브라우저가 손전등 제어를 지원하지 않으면 조용히 무시 (스캔 자체엔 지장 없음)
    }
  });

  document.getElementById("backBtn").addEventListener("click", () => {
    stopCamera();
    location.href = "/app/main-home-disconnected/";
  });

  startCamera();
</script>
</body>
</html>
