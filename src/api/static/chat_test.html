<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모약이 테스트</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  textarea { width: 100%; height: 60px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 24px; line-height: 1.6; }
  .badge {
    display: inline-block; font-size: 12px; color: #1a5d1a; background: #e6f4ea;
    border: 1px solid #b6dfc0; border-radius: 12px; padding: 3px 10px; margin-bottom: 10px;
  }
  .answer { background: #f4f4f4; padding: 16px; border-radius: 8px; white-space: pre-wrap; }
  .sources { margin-top: 8px; color: #555; font-size: 14px; }
  .loading { color: #888; }
  details.evidence { margin-top: 12px; }
  details.evidence summary { cursor: pointer; color: #1a56db; font-size: 14px; }
  .evidence-item {
    margin-top: 8px; padding: 10px 12px; background: #fafafa; border-left: 3px solid #1a56db;
    font-size: 14px; white-space: pre-wrap;
  }
  .evidence-item b { color: #1a56db; }
</style>
</head>
<body>
  <h1>💊 모약이 테스트</h1>
  <textarea id="question" placeholder="예) 활명수는 어디에 사용하나요?"></textarea>
  <br />
  <button id="ask">질문하기</button>
  <div id="result"></div>

<script>
  const askBtn = document.getElementById("ask");
  const questionEl = document.getElementById("question");
  const resultEl = document.getElementById("result");

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  function renderResult(data) {
    resultEl.innerHTML = "";

    if (data.evidence && data.evidence.length) {
      resultEl.appendChild(
        el("div", { className: "badge", textContent: "🏛 식품의약품안전처 공식 데이터 기반" })
      );
    }

    resultEl.appendChild(el("div", { className: "answer", textContent: data.answer }));

    const sourcesText = data.sources.length ? data.sources.join(", ") : "없음";
    resultEl.appendChild(
      el("div", { className: "sources", textContent: "참고 약품: " + sourcesText })
    );

    if (data.evidence && data.evidence.length) {
      const details = el("details", { className: "evidence" });
      details.appendChild(el("summary", { textContent: "원문 근거 보기 (" + data.evidence.length + "건)" }));
      data.evidence.forEach((e) => {
        const item = el("div", { className: "evidence-item" });
        item.appendChild(el("b", { textContent: e.item_name + " · " + e.field_label }));
        item.appendChild(document.createElement("br"));
        item.appendChild(document.createTextNode(e.text));
        details.appendChild(item);
      });
      resultEl.appendChild(details);
    }
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;

    resultEl.innerHTML = '<div class="loading">답변을 생성하는 중입니다...</div>';
    askBtn.disabled = true;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) {
        const err = await res.json();
        resultEl.textContent = "오류: " + JSON.stringify(err);
        return;
      }
      renderResult(await res.json());
    } catch (e) {
      resultEl.textContent = "요청 실패: " + e;
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener("click", ask);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
</script>
</body>
</html>
