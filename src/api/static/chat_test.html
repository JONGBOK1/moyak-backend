<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모약이 테스트</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #thread { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
  .turn { display: flex; flex-direction: column; gap: 6px; }
  .question {
    align-self: flex-end; background: #1a56db; color: #fff; padding: 10px 14px;
    border-radius: 12px; max-width: 80%; white-space: pre-wrap;
  }
  .badge {
    display: inline-block; font-size: 12px; color: #1a5d1a; background: #e6f4ea;
    border: 1px solid #b6dfc0; border-radius: 12px; padding: 3px 10px; width: fit-content;
  }
  .answer { background: #f4f4f4; padding: 16px; border-radius: 8px; white-space: pre-wrap; }
  .sources { color: #555; font-size: 14px; }
  .loading { color: #888; }
  details.evidence { font-size: 14px; }
  details.evidence summary { cursor: pointer; color: #1a56db; }
  .evidence-item {
    margin-top: 8px; padding: 10px 12px; background: #fafafa; border-left: 3px solid #1a56db;
    white-space: pre-wrap;
  }
  .evidence-item b { color: #1a56db; }
  textarea { width: 100%; height: 60px; font-size: 16px; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  .reset { background: none; border: none; color: #888; text-decoration: underline; font-size: 13px; padding: 0; }
  .user-id { font-size: 12px; color: #999; margin-bottom: 12px; }
  .consult-btn { background: #0c5460; color: #fff; border: none; border-radius: 6px; }
  .system-note {
    align-self: center; background: #fff3cd; color: #856404; padding: 8px 14px;
    border-radius: 8px; font-size: 13px; text-align: center;
  }
  .approved-note { background: #d4edda; color: #155724; }
  .rejected-note { background: #f8d7da; color: #721c24; }
  .video-wrap { align-self: center; width: 100%; }
  .video-wrap iframe {
    width: 100%; height: 420px; border: 1px solid #ddd; border-radius: 10px;
  }
  .video-label { font-size: 12px; color: #888; margin-bottom: 4px; text-align: center; }
</style>
</head>
<body>
  <h1>💊 모약이 테스트</h1>
  <div style="font-size:13px; margin-bottom:8px;"><a href="/consult" style="color:#0c5460">🩺 바로 약사상담 →</a></div>
  <div class="user-id">내 사용자 ID: <span id="userIdLabel"></span> (자판기 데모에서 이 ID로 QR 스캔 시뮬레이션하면 됩니다)</div>
  <div id="thread"></div>
  <textarea id="question" placeholder="예) 활명수는 어디에 사용하나요?"></textarea>
  <br />
  <button id="ask">질문하기</button>
  <button id="consult" class="consult-btn">🩺 약사와 상담하기</button>
  <button id="reset" class="reset">대화 초기화</button>

<script>
  const askBtn = document.getElementById("ask");
  const consultBtn = document.getElementById("consult");
  const resetBtn = document.getElementById("reset");
  const questionEl = document.getElementById("question");
  const threadEl = document.getElementById("thread");
  const userIdLabelEl = document.getElementById("userIdLabel");

  let history = []; // [{role, content}, ...]

  // crypto.randomUUID()는 보안 컨텍스트(HTTPS/localhost)에서만 동작해서,
  // 로컬 네트워크 IP로 접속하는 개발 환경(http://192.168.x.x)에서는 쓸 수 없다.
  function makeUserId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  // 아직 실제 로그인/본인인증이 없어서, 브라우저별로 임시 사용자 ID를 만들어 유지한다.
  // (실제 앱에서는 본인인증 후 발급되는 진짜 사용자 ID로 대체될 지점)
  let userId = localStorage.getItem("moyak_user_id");
  if (!userId) {
    userId = makeUserId();
    localStorage.setItem("moyak_user_id", userId);
  }
  userIdLabelEl.textContent = userId;

  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.assign(node, props || {});
    (children || []).forEach((c) => node.appendChild(c));
    return node;
  }

  function renderTurn(question, data) {
    const turn = el("div", { className: "turn" });
    turn.appendChild(el("div", { className: "question", textContent: question }));

    if (data.evidence && data.evidence.length) {
      turn.appendChild(el("div", { className: "badge", textContent: "🏛 식품의약품안전처 공식 데이터 기반" }));
    }
    turn.appendChild(el("div", { className: "answer", textContent: data.answer }));

    const sourcesText = data.sources.length ? data.sources.join(", ") : "없음";
    turn.appendChild(el("div", { className: "sources", textContent: "참고 약품: " + sourcesText }));

    if (data.evidence && data.evidence.length) {
      const details = el("details", { className: "evidence" });
      details.appendChild(el("summary", { textContent: "원문 근거 보기 (" + data.evidence.length + "건)" }));
      data.evidence.forEach((e) => {
        const item = el("div", { className: "evidence-item" });
        item.appendChild(el("b", { textContent: e.item_name + " · " + e.field_label }));
        item.appendChild(document.createElement("br"));
        item.appendChild(document.createTextNode(e.text));
        details.appendChild(item);
      });
      turn.appendChild(details);
    }

    threadEl.appendChild(turn);
    turn.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;

    questionEl.value = "";
    askBtn.disabled = true;
    const loading = el("div", { className: "loading", textContent: "답변을 생성하는 중입니다..." });
    threadEl.appendChild(loading);

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      loading.remove();

      if (!res.ok) {
        const err = await res.json();
        threadEl.appendChild(el("div", { textContent: "오류: " + JSON.stringify(err) }));
        return;
      }
      const data = await res.json();
      renderTurn(question, data);
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: data.answer });
    } catch (e) {
      loading.remove();
      threadEl.appendChild(el("div", { textContent: "요청 실패: " + e }));
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener("click", ask);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
  });
  resetBtn.addEventListener("click", () => {
    history = [];
    threadEl.innerHTML = "";
  });

  const POLL_INTERVAL_MS = 3000;
  let pollTimer = null;

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function renderConsultationOutcome(data) {
    if (data.status === "approved") {
      threadEl.appendChild(
        el("div", {
          className: "system-note approved-note",
          textContent:
            "🎉 약사가 [" + (data.approved_drug_name || "약") + "]을(를) 처방했습니다. " +
            "자판기에서 QR을 스캔하면 받으실 수 있어요.",
        })
      );
    } else if (data.status === "rejected") {
      const reasonText = data.decision_reason ? "사유: " + data.decision_reason : "사유가 별도로 전달되지 않았습니다.";
      threadEl.appendChild(
        el("div", { className: "system-note rejected-note", textContent: "상담이 거절되었습니다. " + reasonText })
      );
    }
    threadEl.lastChild.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function pollConsultationStatus(consultationId) {
    stopPolling();
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch("/consultations/" + consultationId);
        if (!res.ok) return;
        const data = await res.json();
        if (data.status !== "pending") {
          stopPolling();
          renderConsultationOutcome(data);
        }
      } catch (e) {
        // 네트워크 순단 등은 조용히 무시하고 다음 폴링에서 다시 시도한다.
      }
    }, POLL_INTERVAL_MS);
  }

  async function requestConsultation() {
    if (history.length === 0) {
      alert("먼저 챗봇과 증상/약에 대해 대화해주세요. 그 대화 내용이 약사에게 전달됩니다.");
      return;
    }
    consultBtn.disabled = true;

    const waiting = el("div", { className: "system-note", textContent: "🩺 약사 상담을 준비하고 있습니다. 잠시만 기다려주세요..." });
    threadEl.appendChild(waiting);
    waiting.scrollIntoView({ behavior: "smooth", block: "end" });

    try {
      // 이미 대기 중인 상담이 있으면 새로 만들지 않고 그걸 이어서 보여준다.
      const pendingRes = await fetch("/consultations?status=pending&user_id=" + encodeURIComponent(userId));
      const pendingList = pendingRes.ok ? await pendingRes.json() : [];

      let data;
      const reused = pendingList.length > 0;
      if (reused) {
        data = pendingList[0];
      } else {
        const chatSummary = history
          .map((h) => (h.role === "user" ? "사용자: " : "모약이: ") + h.content)
          .join("\n");

        const res = await fetch("/consultations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, chat_summary: chatSummary }),
        });
        data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      }

      waiting.remove();

      if (reused) {
        threadEl.appendChild(
          el("div", { className: "system-note", textContent: "이미 대기 중인 상담이 있어서 이어서 진행합니다. (요청 ID: " + data.id.slice(0, 8) + "...)" })
        );
        threadEl.lastChild.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      if (data.room_url) {
        const videoWrap = el("div", { className: "video-wrap" });
        videoWrap.appendChild(
          el("div", { className: "video-label", textContent: "약사가 입장하면 화상 상담이 시작됩니다 (요청 ID: " + data.id.slice(0, 8) + "...)" })
        );
        videoWrap.appendChild(el("iframe", { src: data.room_url, allow: "camera; microphone; fullscreen; display-capture" }));
        threadEl.appendChild(videoWrap);
        videoWrap.scrollIntoView({ behavior: "smooth", block: "end" });
      } else {
        threadEl.appendChild(
          el("div", {
            className: "system-note",
            textContent:
              "🩺 약사 상담을 요청했습니다. 화상 연결에 문제가 있어 텍스트 상담으로 진행됩니다. " +
              "(요청 ID: " + data.id.slice(0, 8) + "...)",
          })
        );
        threadEl.lastChild.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      pollConsultationStatus(data.id);
    } catch (e) {
      waiting.remove();
      alert("상담 요청 실패: " + e.message);
    } finally {
      consultBtn.disabled = false;
    }
  }

  consultBtn.addEventListener("click", requestConsultation);
</script>
</body>
</html>
