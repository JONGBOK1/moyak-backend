<!doctype html>
<html lang="ko">
<head>
<script src="/static/vendor/chat-request-id.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>모약이 약사 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" />
<style>
  /* 앱(/app)과 같은 톤: 진한 갈색 글자, 베이지 배경, 모약 그린, 노란 포인트 */
  :root {
    color-scheme: light;
    --ink: #3e2723;
    --ink-soft: #7d6d6a;
    --line: #e4ddd2;
    --bg: #f7f3ee;
    --paper: #ffffff;
    --beige: #efebe9;
    --green: #176b5b;
    --green-dark: #105348;
    --green-soft: #ddeee8;
    --yellow: #ffd54f;
    --cream: #fffde7;
    --red: #c0392b;
    --red-soft: #fdecea;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(62, 39, 35, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Gothic A1", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
  }
  button, input, textarea { font-family: inherit; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 24px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 40px; height: 40px; object-fit: contain; }
  .brand .name { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand .sub { font-size: 12px; color: var(--ink-soft); }
  .topbar .spacer { flex: 1; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .live-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 0 3px #2ecc7133; }
  .id-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--beige); border-radius: 99px; padding: 4px 6px 4px 14px;
  }
  .id-box label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .id-box input {
    border: none; background: var(--paper); border-radius: 99px;
    padding: 7px 12px; width: 150px; font-size: 13px; color: var(--ink); outline: none;
  }
  .id-box input:focus { box-shadow: 0 0 0 2px var(--green); }
  .id-box.missing input { box-shadow: 0 0 0 2px var(--yellow); }

  /* ---------- 레이아웃 ---------- */
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px; }
  .sidebar { position: sticky; top: 84px; align-self: start; display: flex; flex-direction: column; gap: 6px; }
  .nav-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 12px 14px; border: none; border-radius: 12px;
    background: transparent; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; text-align: left;
  }
  .nav-btn:hover { background: var(--beige); }
  .nav-btn.active { background: var(--green); color: #fff; }
  .nav-btn .count { min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--yellow); color: var(--ink); font-size: 12px; text-align: center; }
  .nav-btn .count:empty { display: none; }
  .principle {
    margin-top: 14px; padding: 14px; border-radius: 14px;
    background: var(--cream); border: 1px solid #f1e3b8; font-size: 12px; line-height: 1.6; color: #593d0d;
  }
  .principle b { display: block; margin-bottom: 4px; font-size: 13px; }

  main { min-width: 0; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .page-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 13px; }

  /* ---------- 상담 카드 ---------- */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 800; color: var(--green-dark); background: var(--green-soft);
  }
  .who { flex: 1; min-width: 160px; }
  .who .uid { font-weight: 800; font-size: 15px; word-break: break-all; }
  .who .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
  .badge.pending { background: #fff3cd; color: #856404; }
  .badge.approved { background: var(--green-soft); color: var(--green-dark); }
  .badge.rejected { background: var(--red-soft); color: var(--red); }
  .chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--beige); color: var(--ink-soft); }
  .video-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 12px;
    background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; text-decoration: none;
  }
  .video-link:hover { background: #2a1a17; }

  .card-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .col { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); background: #fcfaf7; }
  .section-title { font-size: 12px; font-weight: 800; color: var(--ink-soft); letter-spacing: .3px; margin-bottom: 6px; }

  .chat-log {
    background: var(--bg); border-radius: 12px; padding: 10px; font-size: 13px;
    max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
  }
  .chat-user, .chat-bot, .chat-plain { padding: 6px 10px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; line-height: 1.5; }
  .chat-user { background: var(--green-soft); align-self: flex-end; }
  .chat-bot { background: var(--paper); border: 1px solid var(--line); align-self: flex-start; }
  .chat-plain { color: var(--ink-soft); align-self: center; text-align: center; font-size: 12px; }

  .live-chat { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 12px; }
  .live-chat-head { font-size: 13px; font-weight: 800; color: var(--green); margin-bottom: 8px; }
  .live-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .live-empty { color: #aaa; font-size: 12px; }
  .live-msg { padding: 6px 10px; border-radius: 12px; max-width: 82%; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .live-msg.user { background: var(--beige); align-self: flex-start; }
  .live-msg.pharmacist { background: var(--green); color: #fff; align-self: flex-end; }
  .live-input { display: flex; gap: 6px; margin-top: 8px; }
  .summary-box { background: var(--cream); border: 1px solid #f1e3b8; border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }

  /* ---------- 처방 결정 ---------- */
  .decision { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .decision-title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .field .won { position: relative; }
  .field .won::after { content: "원"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); font-size: 13px; }
  input, textarea {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px #176b5b22; }
  .live-input input { flex: 1; width: auto; }
  .drug-search { position: relative; }
  .drug-dropdown {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 20px rgba(62, 39, 35, 0.12); max-height: 220px; overflow-y: auto; z-index: 5;
  }
  .drug-dropdown.open { display: block; }
  .drug-option { padding: 9px 12px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .drug-option:hover, .drug-option.hover { background: var(--beige); }
  .drug-option .company { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .picked { font-size: 12px; color: var(--green); font-weight: 700; min-height: 16px; }
  .chip.kiosk { background: var(--cream); color: #8b6914; border: 1px solid #f1e3b8; }
  .kiosk-note { font-size: 12px; line-height: 1.5; color: #8b6914; background: var(--cream); border: 1px solid #f1e3b8; border-radius: 10px; padding: 8px 10px; }
  .kiosk-note.plain { color: var(--ink-soft); background: var(--bg); border-color: var(--line); }
  .stock-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .stock-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; width: 100%;
    background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 700;
  }
  .stock-item:hover { background: var(--beige); }
  .stock-item.selected { border-color: var(--green); background: var(--green-soft); }
  .stock-item:disabled { opacity: .45; }
  .qty { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qty-btn { width: 36px; height: 36px; padding: 0; border-radius: 10px; font-size: 18px; background: var(--paper); color: var(--green); border: 1.5px solid var(--green); }
  .qty-btn:hover { background: var(--green-soft); }
  .qty-val { min-width: 28px; text-align: center; font-size: 18px; font-weight: 800; }
  .qty-hint { font-size: 12px; color: var(--ink-soft); }
  .stock-item .meta { font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }

  button {
    -webkit-appearance: none; appearance: none;
    padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
    border-radius: 10px; border: none; background: var(--green); color: #fff;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row > button { flex: 1; padding: 11px; font-size: 14px; }
  button.reject { background: var(--paper); color: var(--red); border: 1.5px solid var(--red); }
  button.reject:hover { background: var(--red-soft); }
  .reject-box { display: none; flex-direction: column; gap: 8px; background: var(--red-soft); border-radius: 12px; padding: 10px; }
  .reject-box.open { display: flex; }
  .reject-box textarea { min-height: 60px; resize: vertical; }
  .reject-box button { background: var(--red); }

  .result { border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
  .result.approved { background: var(--green-soft); color: var(--green-dark); }
  .result.rejected { background: var(--red-soft); color: var(--red); }
  .result b { display: block; font-size: 14px; margin-bottom: 2px; }

  /* ---------- 빈 화면 / 알림 ---------- */
  .empty { text-align: center; padding: 48px 16px; background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-soft); }
  .empty img { width: 96px; opacity: .9; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin: 10px 0 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }

  /* ---------- 상담실: 왼쪽 화상(크게) + 오른쪽 환자 정보·채팅·처방·녹음 (2026-10-23) ---------- */
  .room-btn { border: none; cursor: pointer; font-family: inherit; }
  body.in-room { overflow: hidden; }
  .room {
    position: fixed; inset: 0; z-index: 40; background: #1f1a17;
    display: grid; grid-template-columns: minmax(0, 1fr) 420px;
  }
  .room[hidden] { display: none; }
  .room-video { position: relative; min-width: 0; }
  .room-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .room-side { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  .room-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .room-bar .title { flex: 1; font-weight: 800; font-size: 14px; }
  .room-queue { font-size: 12px; font-weight: 700; color: #8b6914; background: var(--cream); border-radius: 99px; padding: 3px 10px; }
  .room-queue:empty { display: none; }
  .room-bar button { padding: 7px 10px; font-size: 12px; }
  .room-slot { flex: 1; overflow-y: auto; padding: 10px; }
  .room-slot .card { margin: 0; box-shadow: none; border-radius: 14px; }
  .room-slot .card-head { padding: 10px 12px; gap: 8px; }
  .room-slot .card-head .room-btn { display: none; }
  .room-slot .avatar { width: 32px; height: 32px; }
  .room-slot .card-body { grid-template-columns: 1fr; }
  .room-slot .col { padding: 10px 12px; gap: 10px; }
  .room-slot .col + .col { border-left: none; border-top: 1px solid var(--line); }
  .room-slot .chat-log { max-height: 120px; }
  .room-slot .live-list { max-height: 220px; }
  @media (max-width: 900px) {
    .room { grid-template-columns: 1fr; grid-template-rows: 48vh minmax(0, 1fr); }
  }

  /* ---------- 좁은 화면 ---------- */
  @media (max-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 14px; }
    .sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
    .nav-btn { width: auto; flex: 1; }
    .principle { display: none; }
    .card-body { grid-template-columns: 1fr; }
    .col + .col { border-left: none; border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .topbar { padding: 10px 16px; flex-wrap: wrap; }
    .brand .sub, .live-dot { display: none; }
    .id-box { width: 100%; order: 3; }
    .id-box input { flex: 1; width: auto; }
    .card-head { padding: 14px 16px; }
    .col { padding: 14px 16px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/app/main-home-connected/moyak-10.png" alt="" />
      <div>
        <div class="name">MOYAK 약사 콘솔</div>
        <div class="sub">화상 상담 · 처방 승인 · 상담 요약 검토</div>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="live-dot">5초마다 자동 새로고침</span>
    <div class="id-box" id="idBox">
      <label for="pharmacistId">약사 ID</label>
      <input id="pharmacistId" placeholder="예: 약사01" autocomplete="off" />
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav-btn active" data-tab="pending">🩺 대기 중 상담 <span class="count" id="pendingCount"></span></button>
      <button class="nav-btn" data-tab="history">📋 처리 내역</button>
      <div class="principle">
        <b>💡 처방은 약사가 결정해요</b>
        챗봇(AI)은 승인 권한이 없어요. 어떤 약을 줄지는 상담 내용을 보고 약사님이 직접 정하고, 모든 승인·거절은 기록으로 남아요.
      </div>
    </nav>

    <main>
      <section id="pendingTab">
        <div class="page-head">
          <div>
            <h1>대기 중 상담</h1>
            <p>환자의 챗봇 대화를 확인하고 화상 상담 후 처방을 승인하거나 거절해주세요.</p>
          </div>
        </div>
        <div id="pendingList"></div>
      </section>
      <section id="historyTab" hidden>
        <div class="page-head">
          <div>
            <h1>처리 내역</h1>
            <p>내가 승인·거절한 상담이에요. 상담이 끝나지 않았다면 여기서 채팅·녹음·요약을 이어갈 수 있어요.</p>
          </div>
        </div>
        <div id="historyList"></div>
      </section>
    </main>
  </div>
  <div class="room" id="room" hidden>
    <div class="room-video">
      <iframe id="roomFrame" title="화상 상담" allow="camera; microphone; autoplay; display-capture; fullscreen"></iframe>
    </div>
    <aside class="room-side">
      <div class="room-bar">
        <span class="title" id="roomTitle">상담실</span>
        <span class="room-queue" id="roomQueue"></span>
        <button class="reject" id="roomLeave">상담실 나가기</button>
      </div>
      <div class="room-slot" id="roomSlot"></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>

<script src="/static/vendor/consult-recording.js"></script>
<script>
  const MASCOT = "/app/main-home-connected/moyak-10.png";
  const DIRECT_PREFIX = "직접 상담 요청";
  const pharmacistIdEl = document.getElementById("pharmacistId");
  pharmacistIdEl.value = localStorage.getItem("moyak_pharmacist_id") || "";
  const syncIdBox = () => document.getElementById("idBox").classList.toggle("missing", !pharmacistIdEl.value.trim());
  pharmacistIdEl.addEventListener("input", syncIdBox);
  pharmacistIdEl.addEventListener("change", () => {
    localStorage.setItem("moyak_pharmacist_id", pharmacistIdEl.value);
  });
  syncIdBox();

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s ?? "";
    return div.innerHTML;
  }

  function formatDate(isoString) {
    if (!isoString) return "";
    const date = new Date(isoString + "Z");
    return date.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  let toastTimer = null;
  function toast(message, isError) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.toggle("error", !!isError);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
  }

  function requirePharmacistId() {
    if (pharmacistIdEl.value.trim()) return true;
    toast("오른쪽 위에 약사 ID를 먼저 입력해주세요.", true);
    pharmacistIdEl.focus();
    return false;
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function renderChatLog(summary) {
    return (summary || "")
      .split("\n")
      .filter((line) => line.trim())
      .map((line) => {
        let cls = "chat-plain";
        let text = line;
        if (line.startsWith("사용자: ")) {
          cls = "chat-user";
          text = line.slice(5);
        } else if (line.startsWith("모약이: ")) {
          cls = "chat-bot";
          text = line.slice(5);
        }
        return `<div class="${cls}">${escapeHtml(text)}</div>`;
      })
      .join("");
  }

  // 카드 머리: 환자 · 상태 · 진입 경로 · 화상 입장
  function cardHead(c, badgeClass, badgeText, timeLabel, time) {
    const direct = (c.chat_summary || "").startsWith(DIRECT_PREFIX);
    return `
      <div class="card-head">
        <div class="avatar">${escapeHtml((c.user_id || "?").slice(0, 1).toUpperCase())}</div>
        <div class="who">
          <div class="uid">${escapeHtml(c.user_id)} <span class="badge ${badgeClass}">${badgeText}</span></div>
          <div class="meta">${timeLabel} ${formatDate(time)}</div>
        </div>
        <span class="chip">${direct ? "⚡ 바로 상담 (챗봇 대화 없음)" : "💬 챗봇 상담 후 요청"}</span>
        ${c.machine_code ? `<span class="chip kiosk">📍 키오스크 ${escapeHtml(c.machine_code)}</span>` : ""}
        ${c.room_url ? `<button type="button" class="video-link room-btn" data-room-url="${escapeHtml(c.room_url)}" data-user="${escapeHtml(c.user_id)}">🎥 상담실 열기</button>` : ""}
      </div>`;
  }

  // ---------- 화상 상담 중 채팅 + 음성 기록·AI 요약 ----------
  // 카드가 화면에서 사라지면(승인/거절로 대기 목록에서 빠지는 등) 폴링도 스스로 멈춘다.
  function attachLiveChat(card, c, chatHost, recHost) {
    const box = document.createElement("div");
    box.className = "live-chat";
    box.innerHTML = `
      <div class="live-chat-head">💬 화상 상담 채팅 (환자와 실시간)</div>
      <div class="live-list"><div class="live-empty">아직 메시지가 없어요.</div></div>
      <div class="live-input"><input placeholder="환자에게 보낼 메시지" maxlength="1000" /><button>보내기</button></div>
      <div class="summary-box" hidden></div>`;
    chatHost.appendChild(box);

    // 음성 기록·AI 요약 패널: 상담 연결 → 양측 동의 → 자동 녹음·전사 → (승인/거절 후) 상담 종료 → 요약 검토·공개
    const recBox = document.createElement("div");
    recBox.className = "live-chat";
    recHost.appendChild(recBox);
    MoyakRecording.mount(recBox, { consultationId: c.id, actorId: () => pharmacistIdEl.value, role: "pharmacist" });

    const list = box.querySelector(".live-list");
    const input = box.querySelector(".live-input input");
    const seen = new Set();
    let timer = null;

    function render(messages) {
      let added = false;
      messages.forEach((m) => {
        if (seen.has(m.id)) return;
        seen.add(m.id);
        if (!added && list.querySelector(".live-empty")) list.innerHTML = "";
        added = true;
        const div = document.createElement("div");
        div.className = "live-msg " + m.sender_role;
        div.textContent = m.content;
        list.appendChild(div);
      });
      if (added) list.scrollTop = list.scrollHeight;
    }

    function showSummary(summary) {
      clearInterval(timer);
      const inputRow = box.querySelector(".live-input");
      if (inputRow) inputRow.remove();
      const sb = box.querySelector(".summary-box");
      sb.textContent = "📝 상담 요약\n" + summary;
      sb.hidden = false;
    }

    async function refresh() {
      if (!card.isConnected) return clearInterval(timer);
      try {
        const [consultation, messages] = await Promise.all([
          api("GET", `/consultations/${c.id}`),
          api("GET", `/consultations/${c.id}/messages`),
        ]);
        render(messages);
        if (consultation.summary) showSummary(consultation.summary);
      } catch (e) {
        // 다음 폴링에서 재시도
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || !requirePharmacistId()) return;
      input.value = "";
      try {
        render([await api("POST", `/consultations/${c.id}/messages`, {
          sender_role: "pharmacist",
          sender_id: pharmacistIdEl.value,
          content: text,
        })]);
      } catch (e) {
        input.value = text;
        toast("메시지 전송 실패: " + e.message, true);
      }
    }
    box.querySelector(".live-input button").addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.isComposing) send();
    });

    if (c.summary) {
      showSummary(c.summary);
      return;
    }
    // 카드가 아직 화면에 붙기 전일 수 있어서 첫 조회는 한 틱 뒤로 미룬다
    setTimeout(refresh, 0);
    timer = setInterval(refresh, 3000);
  }

  // ---------- 환자가 고른 키오스크 재고에서만 처방 ----------
  // 키오스크가 지정된 상담이면 검색 대신 그 키오스크의 의약품 재고 목록에서 고른다(서버도 재고 없는 약 승인을 거절).
  // 재고 정보가 없는 DB(로컬 시연)면 기존처럼 검색해서 처방한다.
  async function setupKioskStock(card, c, drugResults, nameInput) {
    const box = card.querySelector(".kiosk-box");
    const search = card.querySelector(".drug-search");
    const priceInput = card.querySelector(".drug-price");
    if (!c.machine_code) {
      box.innerHTML = '<div class="kiosk-note plain">환자가 키오스크를 고르지 않았어요. 환자가 받을 키오스크에 재고가 있는 약인지 확인해주세요.</div>';
      return;
    }
    let data;
    try {
      data = await api("GET", `/vending/machines/${encodeURIComponent(c.machine_code)}/medicines`);
    } catch (e) {
      box.innerHTML = `<div class="kiosk-note">키오스크 ${escapeHtml(c.machine_code)} 재고를 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
      return;
    }
    const where = `📍 ${escapeHtml(data.machine_name)} (${escapeHtml(data.machine_code)})`;
    if (!data.restricted) {
      box.innerHTML = `<div class="kiosk-note plain">${where} — 이 서버에는 의약품 재고 정보가 없어 검색으로 처방해요.</div>`;
      return;
    }
    search.style.display = "none";
    const inStock = data.items.filter((m) => m.stock > 0);
    box.innerHTML = `<div class="kiosk-note">${where} 재고에 있는 약만 처방할 수 있어요.${inStock.length ? "" : "<br><b>재고가 있는 약이 없어요.</b> 거절하고 다른 키오스크를 안내해주세요."}</div>
      <div class="stock-list">${data.items.map((m, i) => `
        <button type="button" class="stock-item" data-i="${i}" ${m.stock > 0 ? "" : "disabled"}>
          <span>${escapeHtml(m.item_name)}</span>
          <span class="meta">${m.stock > 0 ? `${m.stock}개` : "품절"}${m.price != null ? ` · ${m.price.toLocaleString()}원` : ""}</span>
        </button>`).join("")}</div>`;
    box.querySelectorAll(".stock-item").forEach((btn) => btn.addEventListener("click", () => {
      const m = data.items[Number(btn.dataset.i)];
      box.querySelectorAll(".stock-item").forEach((b) => b.classList.toggle("selected", b === btn));
      nameInput.value = m.item_name;
      drugResults.items = [m];
      drugResults.selectedSeq = m.item_seq;
      card.qty.unit = m.price; // 키오스크 판매가(1개)
      card.qty.max = Math.min(10, m.stock); // 재고보다 많이 처방할 수 없음
      card.qty.set(card.qty.value); // 금액 = 판매가 × 수량 으로 채움(수정 가능)
    }));
  }

  // ---------- 약품 검색 자동완성 ----------
  function debounce(fn, ms) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), ms);
    };
  }

  // 네이티브 <input list>+<datalist> 조합은 크롬 계열 브라우저에서 한글 IME 조합 중에
  // datalist 옵션을 갱신하면 입력 중이던 글자가 통째로 지워지는 버그가 있다
  // (예: "타이레"까지만 남고 사라짐). 그래서 직접 만든 드롭다운으로 대체한다.
  function attachDrugSearch(nameInput, dropdown, resultsHolder, pickedEl) {
    const closeDropdown = () => {
      dropdown.classList.remove("open");
      dropdown.innerHTML = "";
    };

    const search = debounce(async () => {
      const q = nameInput.value.trim();
      resultsHolder.selectedSeq = ""; // 사용자가 다시 타이핑하면 이전 선택은 무효화
      pickedEl.textContent = "";
      if (!q) {
        closeDropdown();
        return;
      }
      try {
        const results = await api("GET", `/drugs/search?q=${encodeURIComponent(q)}`);
        resultsHolder.items = results;
        if (results.length === 0) {
          dropdown.innerHTML = '<div class="drug-option" style="color:#999;cursor:default">검색 결과가 없어요</div>';
          dropdown.classList.add("open");
          return;
        }
        dropdown.innerHTML = results
          .map(
            (r, i) =>
              `<div class="drug-option" data-index="${i}"><span class="name">${escapeHtml(r.item_name)}</span><span class="company">${escapeHtml(r.company)}</span></div>`
          )
          .join("");
        dropdown.classList.add("open");
      } catch (e) {
        dropdown.innerHTML = '<div class="drug-option" style="color:#c0392b;cursor:default">약품 검색에 실패했어요: ' + escapeHtml(e.message) + "</div>";
        dropdown.classList.add("open");
      }
    }, 250);

    nameInput.addEventListener("input", search);

    dropdown.addEventListener("mousedown", (e) => {
      // click 대신 mousedown: input의 blur보다 먼저 실행되게 해서 드롭다운이 닫히기 전에 선택을 잡는다.
      const opt = e.target.closest(".drug-option");
      if (!opt || opt.dataset.index === undefined) return; // 안내 문구 줄은 선택 대상 아님
      const item = resultsHolder.items[Number(opt.dataset.index)];
      nameInput.value = item.item_name;
      resultsHolder.selectedSeq = item.item_seq;
      pickedEl.textContent = `✓ ${item.company} · 품목코드 ${item.item_seq}`;
      closeDropdown();
    });

    nameInput.addEventListener("blur", () => setTimeout(closeDropdown, 150));
  }

  function resolveDrugSeq(resultsHolder, name) {
    if (resultsHolder.selectedSeq) return resultsHolder.selectedSeq;
    const match = (resultsHolder.items || []).find((r) => r.item_name === name);
    return match ? match.item_seq : "";
  }

  // ---------- 탭 전환 ----------
  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const isPending = btn.dataset.tab === "pending";
      document.getElementById("pendingTab").hidden = !isPending;
      document.getElementById("historyTab").hidden = isPending;
      if (!isPending) loadHistory();
    });
  });

  function emptyState(title, text) {
    return `<div class="empty"><img src="${MASCOT}" alt="" /><b>${title}</b>${text}</div>`;
  }

  // ---------- 대기 목록 ----------
  // 5초마다 자동 새로고침되는데, 매번 카드를 통째로 새로 그리면 약사가 입력 중이던
  // 약품명이 계속 지워지는 문제가 있었다. 그래서 이미 화면에 있는 카드는 건드리지 않고
  // 새로 들어온 상담만 추가, 더 이상 대기 중이 아닌 상담만 제거하는 방식으로 바꿨다.
  async function loadPending() {
    const holder = document.getElementById("pendingList");
    try {
      const items = await api("GET", "/consultations?status=pending");
      document.getElementById("pendingCount").textContent = items.length || "";

      const empty = holder.querySelector(".empty, .load-error");
      if (empty) empty.remove();

      const currentIds = new Set(items.map((c) => c.id));
      holder.querySelectorAll(".card[data-id]").forEach((el) => {
        if (!currentIds.has(el.dataset.id)) el.remove();
      });
      // 상담실에 들어가 있는 상담은 대기 목록에서 빠져 있으니, 그 밖의 대기 건수만 상단에 알려준다
      const inRoom = roomState.card && roomState.card.dataset.id;
      const others = items.filter((c) => c.id !== inRoom).length;
      document.getElementById("roomQueue").textContent = others ? `다른 대기 ${others}건` : "";

      if (items.length === 0) {
        holder.innerHTML = emptyState("대기 중인 상담이 없어요", "새 상담 요청이 들어오면 여기에 자동으로 나타나요.");
        return;
      }

      items.forEach((c) => {
        // 이미 떠있는 카드(상담실에 옮겨 둔 카드 포함)는 그대로 둠 (입력 중인 값 보존)
        if (document.querySelector(`.card[data-id="${c.id}"]`)) return;

        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = c.id;

        const drugResults = { items: [], selectedSeq: "" };
        const direct = (c.chat_summary || "").startsWith(DIRECT_PREFIX);
        card.innerHTML = `
          ${cardHead(c, "pending", "대기중", "신청", c.created_at)}
          <div class="card-body">
            <div class="col left">
              <div>
                <div class="section-title">상담 전 챗봇 대화</div>
                <div class="chat-log">${direct ? '<div class="chat-plain">챗봇 대화 없이 바로 상담을 요청했어요. 화상으로 증상을 여쭤봐주세요.</div>' : renderChatLog(c.chat_summary)}</div>
              </div>
            </div>
            <div class="col right">
              <div class="decision">
                <div class="decision-title">💊 처방 결정</div>
                <div class="kiosk-box"></div>
                <div class="field drug-search">
                  <label>처방할 약품</label>
                  <input class="drug-name" placeholder="약품명 검색 후 목록에서 선택" value="${escapeHtml(c.requested_drug_name || "")}" autocomplete="off" />
                  <div class="drug-dropdown"></div>
                  <div class="picked"></div>
                </div>
                <div class="field">
                  <label>수량</label>
                  <div class="qty">
                    <button type="button" class="qty-btn" data-d="-1" aria-label="수량 줄이기">−</button>
                    <span class="qty-val">1</span><span>개</span>
                    <button type="button" class="qty-btn" data-d="1" aria-label="수량 늘리기">+</button>
                    <span class="qty-hint">최대 10개</span>
                  </div>
                </div>
                <div class="field">
                  <label>결제 금액 (수량 전체, 키오스크 결제 총액)</label>
                  <div class="won"><input class="drug-price" type="number" min="0" step="100" inputmode="numeric" placeholder="예: 3000" /></div>
                </div>
                <div class="btn-row">
                  <button class="approve-btn">✓ 처방 승인</button>
                  <button class="reject reject-btn">거절</button>
                </div>
                <div class="reject-box">
                  <textarea class="reject-reason" maxlength="500" placeholder="거절 사유 (환자 화면에 그대로 보여요) 예: 대면 진료가 필요해 보여요."></textarea>
                  <button class="reject-confirm">거절 확정</button>
                </div>
              </div>
            </div>
          </div>
        `;

        attachLiveChat(card, c, card.querySelector(".col.left"), card.querySelector(".col.right"));

        const nameInput = card.querySelector(".drug-name");
        const dropdown = card.querySelector(".drug-dropdown");
        attachDrugSearch(nameInput, dropdown, drugResults, card.querySelector(".picked"));
        // 수량: 키오스크 재고 약을 고르면 그 재고까지, 아니면 10개까지. 단가를 알면 금액을 자동 계산
        card.qty = {
          value: 1, max: 10, unit: null,
          set(v) {
            this.value = Math.max(1, Math.min(this.max, v));
            card.querySelector(".qty-val").textContent = this.value;
            card.querySelector(".qty-hint").textContent = this.unit != null
              ? `${this.unit.toLocaleString()}원 × ${this.value}개 · 최대 ${this.max}개` : `최대 ${this.max}개`;
            if (this.unit != null) card.querySelector(".drug-price").value = this.unit * this.value;
          },
        };
        card.querySelectorAll(".qty-btn").forEach((b) => b.addEventListener("click", () => card.qty.set(card.qty.value + Number(b.dataset.d))));
        setupKioskStock(card, c, drugResults, nameInput);

        card.querySelector(".approve-btn").addEventListener("click", async (e) => {
          const itemSeq = resolveDrugSeq(drugResults, nameInput.value) || c.requested_drug_item_seq;
          if (!itemSeq) {
            toast(c.machine_code ? "키오스크 재고 목록에서 처방할 약을 골라주세요." : "약품을 검색한 뒤 목록에서 골라주세요 (정확한 품목코드가 지정돼요).", true);
            nameInput.focus();
            return;
          }
          const priceText = card.querySelector(".drug-price").value.trim();
          const price = Number(priceText);
          if (priceText === "" || !Number.isInteger(price) || price < 0) {
            toast("판매가를 원 단위 숫자로 입력해주세요 (키오스크에서 이 금액으로 결제돼요).", true);
            card.querySelector(".drug-price").focus();
            return;
          }
          if (!requirePharmacistId()) return;
          e.target.disabled = true;
          try {
            const data = await api("POST", `/consultations/${c.id}/decision`, {
              pharmacist_id: pharmacistIdEl.value,
              approve: true,
              drug_item_seq: itemSeq,
              drug_item_name: nameInput.value,
              price,
              quantity: card.qty.value,
            });
            toast(`승인 완료 — ${data.approved_drug_name} × ${card.qty.value}개 (${price.toLocaleString()}원). 처리 내역에서 상담을 이어갈 수 있어요.`);
            loadPending();
          } catch (err) {
            toast("오류: " + err.message, true);
          } finally {
            e.target.disabled = false;
          }
        });

        const rejectBox = card.querySelector(".reject-box");
        card.querySelector(".reject-btn").addEventListener("click", () => {
          rejectBox.classList.toggle("open");
          if (rejectBox.classList.contains("open")) rejectBox.querySelector("textarea").focus();
        });
        card.querySelector(".reject-confirm").addEventListener("click", async (e) => {
          if (!requirePharmacistId()) return;
          e.target.disabled = true;
          try {
            await api("POST", `/consultations/${c.id}/decision`, {
              pharmacist_id: pharmacistIdEl.value,
              approve: false,
              reason: rejectBox.querySelector("textarea").value.trim(),
            });
            toast("거절 처리했어요. 환자 화면에 사유가 표시돼요.");
            loadPending();
          } catch (err) {
            toast("오류: " + err.message, true);
          } finally {
            e.target.disabled = false;
          }
        });

        holder.appendChild(card);
      });
    } catch (e) {
      holder.innerHTML = `<div class="empty load-error"><b>목록을 불러오지 못했어요</b>${escapeHtml(e.message)}</div>`;
    }
  }

  // ---------- 처리 내역 ----------
  async function loadHistory() {
    const holder = document.getElementById("historyList");
    if (!pharmacistIdEl.value) {
      holder.innerHTML = emptyState("약사 ID를 입력해주세요", "오른쪽 위에 약사 ID를 입력하면 내가 처리한 상담을 볼 수 있어요.");
      return;
    }
    holder.innerHTML = '<div class="empty">불러오는 중…</div>';
    try {
      const items = await api("GET", `/consultations?pharmacist_id=${encodeURIComponent(pharmacistIdEl.value)}`);
      if (items.length === 0) {
        holder.innerHTML = emptyState("아직 처리한 상담이 없어요", "대기 중 상담에서 승인하거나 거절하면 여기에 모여요.");
        return;
      }
      holder.innerHTML = "";
      items.forEach((c) => {
        const card = document.createElement("div");
        card.className = "card";
        const approved = c.status === "approved";
        const direct = (c.chat_summary || "").startsWith(DIRECT_PREFIX);
        card.innerHTML = `
          ${cardHead(c, approved ? "approved" : "rejected", approved ? "승인" : c.status === "cancelled" ? "취소" : "거절", "처리", c.decided_at)}
          <div class="card-body">
            <div class="col left">
              <div>
                <div class="section-title">상담 전 챗봇 대화</div>
                <div class="chat-log">${direct ? '<div class="chat-plain">챗봇 대화 없이 바로 온 상담이에요.</div>' : renderChatLog(c.chat_summary)}</div>
              </div>
            </div>
            <div class="col right">
              <div class="result ${approved ? "approved" : "rejected"}">
                ${approved
                  ? `<b>✓ 처방 승인</b>${escapeHtml(c.approved_drug_name || "")}${c.approved_quantity > 1 ? ` × ${c.approved_quantity}개` : ""}`
                  : `<b>거절</b>${escapeHtml(c.decision_reason || "사유 없음")}`}
              </div>
            </div>
          </div>
        `;
        holder.appendChild(card);
        // 처리(승인/거절) 후에도 화상 상담이 이어질 수 있으니, 아직 종료 전이면 채팅/녹음/요약을 계속 제공
        if (c.status !== "cancelled") attachLiveChat(card, c, card.querySelector(".col.left"), card.querySelector(".col.right"));
      });
    } catch (e) {
      holder.innerHTML = `<div class="empty"><b>내역을 불러오지 못했어요</b>${escapeHtml(e.message)}</div>`;
    }
  }

  // ---------- 상담실 (2026-10-23) ----------
  // 카드의 "상담실 열기" → 화면 전체 상담실: 왼쪽에 Daily 화상(페이지 안), 오른쪽에 그 상담 카드를 그대로 옮겨 놓는다.
  // 카드를 옮기기만 하므로 채팅·처방·수량·녹음·요약은 원래 기능 그대로 이어진다(폴링도 끊기지 않음).
  const roomState = { card: null, placeholder: null };

  function openRoom(card, url, user) {
    if (roomState.card) {
      toast("이미 상담실에 들어가 있어요. 먼저 나와주세요.", true);
      return;
    }
    roomState.placeholder = document.createComment("room-card");
    card.replaceWith(roomState.placeholder);
    document.getElementById("roomSlot").appendChild(card);
    roomState.card = card;
    document.getElementById("roomTitle").textContent = `상담실 · ${user}`;
    document.getElementById("roomFrame").src = url;
    document.getElementById("room").hidden = false;
    document.body.classList.add("in-room");
    if (!pharmacistIdEl.value.trim()) toast("처방·채팅을 하려면 약사 ID를 먼저 입력해주세요.", true);
  }

  function leaveRoom() {
    if (!roomState.card) return;
    if (!confirm("상담실을 나가면 화상 통화가 끊겨요. 나갈까요?")) return;
    document.getElementById("roomFrame").src = "about:blank";
    const { card, placeholder } = roomState;
    // 원래 자리에 돌려놓는다. 그 사이 목록이 다시 그려졌으면(처리 내역 등) 카드는 버리고 목록을 새로 불러온다.
    if (placeholder.isConnected) placeholder.replaceWith(card);
    else card.remove();
    roomState.card = roomState.placeholder = null;
    document.getElementById("room").hidden = true;
    document.body.classList.remove("in-room");
    loadPending();
    if (!document.getElementById("historyTab").hidden) loadHistory();
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".room-btn");
    if (!btn) return;
    openRoom(btn.closest(".card"), btn.dataset.roomUrl, btn.dataset.user);
  });
  document.getElementById("roomLeave").addEventListener("click", leaveRoom);

  loadPending();
  setInterval(() => {
    if (!document.getElementById("pendingTab").hidden) loadPending();
  }, 5000);
</script>
</body>
</html>
