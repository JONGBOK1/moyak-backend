<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>모약이 — 약사 전용</title>
<style>
  :root { color-scheme: light; }
  body { font-family: sans-serif; max-width: 720px; margin: 30px auto; padding: 0 16px; color: #222; background: #fff; }
  h1 { font-size: 20px; }
  .note { color: #888; font-size: 13px; }
  .id-row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .id-row input { flex: 1; padding: 6px 8px; font-size: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #ddd; }
  .tab-btn {
    -webkit-appearance: none;
    appearance: none;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 0;
    background: #fff;
    color: #222;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { border-bottom-color: #222; font-weight: bold; }
  .card { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .badge.pending { background: #fff3cd; color: #856404; }
  .badge.approved { background: #d4edda; color: #155724; }
  .badge.rejected { background: #f8d7da; color: #721c24; }
  .chat-log { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 8px; margin: 8px 0; font-size: 13px; max-height: 160px; overflow-y: auto; }
  .chat-user, .chat-bot, .chat-plain { padding: 4px 8px; border-radius: 10px; margin: 3px 0; max-width: 85%; white-space: pre-wrap; }
  .chat-user { background: #e8f0fe; margin-left: auto; text-align: right; }
  .chat-bot { background: #fff3cd; }
  .chat-plain { color: #888; }
  .decide-row { display: flex; gap: 6px; margin-top: 8px; }
  .decide-row input { flex: 1; padding: 6px 8px; font-size: 13px; }
  input, textarea {
    -webkit-appearance: none;
    appearance: none;
    background: #fff;
    color: #222;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
  }
  button.reject { background: #fff; color: #c0392b; border-color: #c0392b; }
  a.video-link { display: inline-block; margin: 6px 0; }
</style>
</head>
<body>
  <h1>🩺 모약이 약사 대시보드</h1>
  <div class="id-row">
    <label>약사 ID</label>
    <input id="pharmacistId" />
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="pending">대기 목록</button>
    <button class="tab-btn" data-tab="history">처리 내역</button>
  </div>

  <div id="pendingTab"></div>
  <div id="historyTab" style="display:none"></div>

<script>
  const pharmacistIdEl = document.getElementById("pharmacistId");
  pharmacistIdEl.value = localStorage.getItem("moyak_pharmacist_id") || "";
  pharmacistIdEl.addEventListener("change", () => {
    localStorage.setItem("moyak_pharmacist_id", pharmacistIdEl.value);
  });

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function formatDate(isoString) {
    const date = new Date(isoString + "Z");
    return date.toLocaleString();
  }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
    return data;
  }

  function renderChatLog(summary) {
    return summary
      .split("\n")
      .map((line) => {
        let cls = "chat-plain";
        let text = line;
        if (line.startsWith("사용자: ")) {
          cls = "chat-user";
          text = line.slice(5);
        } else if (line.startsWith("모약이: ")) {
          cls = "chat-bot";
          text = line.slice(5);
        }
        return `<div class="${cls}">${escapeHtml(text)}</div>`;
      })
      .join("");
  }

  // ---------- 약품 검색 자동완성 ----------
  function debounce(fn, ms) {
    let timer = null;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), ms);
    };
  }

  function attachDrugSearch(nameInput, datalist, resultsHolder) {
    const search = debounce(async () => {
      const q = nameInput.value.trim();
      if (!q) {
        datalist.innerHTML = "";
        return;
      }
      try {
        const results = await api("GET", `/drugs/search?q=${encodeURIComponent(q)}`);
        resultsHolder.items = results;
        datalist.innerHTML = results
          .map((r) => `<option value="${escapeHtml(r.item_name)}">${escapeHtml(r.company)}</option>`)
          .join("");
      } catch (e) {
        // 검색 실패는 조용히 무시 (자동완성이라 치명적이지 않음)
      }
    }, 250);
    nameInput.addEventListener("input", search);
  }

  function resolveDrugSeq(resultsHolder, name) {
    const match = (resultsHolder.items || []).find((r) => r.item_name === name);
    return match ? match.item_seq : "";
  }

  // ---------- 탭 전환 ----------
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      const isPending = btn.dataset.tab === "pending";
      document.getElementById("pendingTab").style.display = isPending ? "block" : "none";
      document.getElementById("historyTab").style.display = isPending ? "none" : "block";
      if (!isPending) loadHistory();
    });
  });

  // ---------- 대기 목록 ----------
  async function loadPending() {
    const holder = document.getElementById("pendingTab");
    try {
      const items = await api("GET", "/consultations?status=pending");
      if (items.length === 0) {
        holder.innerHTML = '<p class="note">대기 중인 상담이 없습니다.</p>';
        return;
      }
      holder.innerHTML = "";
      items.forEach((c) => {
        const card = document.createElement("div");
        card.className = "card";

        const drugResults = { items: [] };
        card.innerHTML = `
          <div><b>${escapeHtml(c.user_id)}</b> <span class="badge pending">대기중</span></div>
          <div class="note">신청 시각: ${formatDate(c.created_at)}</div>
          <div class="chat-log">${renderChatLog(c.chat_summary)}</div>
          ${c.room_url ? `<a class="video-link" href="${c.room_url}" target="_blank">🎥 화상 상담 입장</a>` : ""}
          <div class="decide-row">
            <input class="drug-name" list="drugs-${c.id}" placeholder="처방할 약품명 검색" value="${escapeHtml(c.requested_drug_name || "")}" />
            <datalist id="drugs-${c.id}"></datalist>
          </div>
          <div class="decide-row">
            <button class="approve-btn">처방 승인</button>
            <button class="reject reject-btn">거절</button>
          </div>
        `;

        const nameInput = card.querySelector(".drug-name");
        const datalist = card.querySelector("datalist");
        attachDrugSearch(nameInput, datalist, drugResults);

        card.querySelector(".approve-btn").addEventListener("click", async () => {
          const itemSeq = resolveDrugSeq(drugResults, nameInput.value) || c.requested_drug_item_seq;
          if (!itemSeq) {
            alert("목록에서 약품을 선택해주세요 (검색 후 자동완성에서 골라야 정확한 코드가 지정됩니다).");
            return;
          }
          if (!pharmacistIdEl.value) {
            alert("약사 ID를 입력해주세요.");
            return;
          }
          try {
            const data = await api("POST", `/consultations/${c.id}/decision`, {
              pharmacist_id: pharmacistIdEl.value,
              approve: true,
              drug_item_seq: itemSeq,
              drug_item_name: nameInput.value,
            });
            alert(`승인 완료 — 처방약: ${data.approved_drug_name}`);
            loadPending();
          } catch (e) {
            alert("오류: " + e.message);
          }
        });

        card.querySelector(".reject-btn").addEventListener("click", async () => {
          if (!pharmacistIdEl.value) {
            alert("약사 ID를 입력해주세요.");
            return;
          }
          const reason = prompt("거절 사유를 입력해주세요.");
          if (reason === null) return;
          try {
            await api("POST", `/consultations/${c.id}/decision`, {
              pharmacist_id: pharmacistIdEl.value,
              approve: false,
              reason,
            });
            loadPending();
          } catch (e) {
            alert("오류: " + e.message);
          }
        });

        holder.appendChild(card);
      });
    } catch (e) {
      holder.innerHTML = "오류: " + e.message;
    }
  }

  // ---------- 처리 내역 ----------
  async function loadHistory() {
    const holder = document.getElementById("historyTab");
    if (!pharmacistIdEl.value) {
      holder.innerHTML = '<p class="note">약사 ID를 입력하면 본인이 처리한 내역을 볼 수 있습니다.</p>';
      return;
    }
    holder.innerHTML = "불러오는 중...";
    try {
      const items = await api("GET", `/consultations?pharmacist_id=${encodeURIComponent(pharmacistIdEl.value)}`);
      if (items.length === 0) {
        holder.innerHTML = '<p class="note">처리한 내역이 없습니다.</p>';
        return;
      }
      holder.innerHTML = "";
      items.forEach((c) => {
        const card = document.createElement("div");
        card.className = "card";
        const badgeClass = c.status === "approved" ? "approved" : "rejected";
        const badgeText = c.status === "approved" ? "승인" : "거절";
        card.innerHTML = `
          <div><b>${escapeHtml(c.user_id)}</b> <span class="badge ${badgeClass}">${badgeText}</span></div>
          <div class="note">처리 시각: ${formatDate(c.decided_at)}</div>
          ${c.approved_drug_name ? `<div>처방약: ${escapeHtml(c.approved_drug_name)}</div>` : ""}
          ${c.decision_reason ? `<div>거절 사유: ${escapeHtml(c.decision_reason)}</div>` : ""}
          <div class="chat-log">${renderChatLog(c.chat_summary)}</div>
        `;
        holder.appendChild(card);
      });
    } catch (e) {
      holder.innerHTML = "오류: " + e.message;
    }
  }

  loadPending();
  setInterval(() => {
    if (document.getElementById("pendingTab").style.display !== "none") loadPending();
  }, 5000);
</script>
</body>
</html>
